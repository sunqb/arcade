<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>雷霆战机 · Thunder Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05060f;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  @media (pointer: coarse) { #game { cursor: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
/* ==========================================================================
   雷霆战机 · Thunder Fighter
   单文件 Canvas 弹幕射击 Demo — 无外部依赖、无持久化存储
   ========================================================================== */
(function () {
'use strict';

/* ------------------------------ 常量与工具 ------------------------------ */
const W = 480, H = 800;              // 逻辑世界尺寸（所有玩法坐标都在此坐标系）
const TAU = Math.PI * 2;

const rand  = (a, b) => a + Math.random() * (b - a);
const randI = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const hit   = (a, b) => {
  const dx = a.x - b.x, dy = a.y - b.y, r = a.r + b.r;
  return dx * dx + dy * dy < r * r;
};

/* ------------------------------ 画布与视口 ------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const view = { s: 1, ox: 0, oy: 0, dpr: 1 };
let scanPattern = null;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width  = Math.max(1, Math.floor(cw * dpr));
  canvas.height = Math.max(1, Math.floor(ch * dpr));
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';

  const s = Math.min(cw / W, ch / H);
  view.s  = s * dpr;
  view.ox = (canvas.width  - W * view.s) / 2;
  view.oy = (canvas.height - H * view.s) / 2;
  view.dpr = dpr;

  // 扫描线图案（设备像素空间，构建一次）
  const c = document.createElement('canvas');
  c.width = 1; c.height = 4;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.fillRect(0, 0, 1, 2);
  scanPattern = ctx.createPattern(c, 'repeat');
}

function toWorld(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: ((clientX - r.left) * view.dpr - view.ox) / view.s,
    y: ((clientY - r.top)  * view.dpr - view.oy) / view.s
  };
}

/* ------------------------------ 精灵预渲染 ------------------------------ */
/* 用离屏画布缓存光晕，避免每帧创建渐变导致的性能塌陷 */
function makeOrb(rgb, size) {
  const c = document.createElement('canvas');
  const s = Math.ceil(size * 2);
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size, size, 0, size, size, size);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(' + rgb + ',0.95)');
  grd.addColorStop(0.52, 'rgba(' + rgb + ',0.32)');
  grd.addColorStop(1.00, 'rgba(' + rgb + ',0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(size, size, size, 0, TAU); g.fill();
  return c;
}

const SP = {
  pBullet: makeOrb('80,240,255', 16),
  foeBullet: makeOrb('255,90,150', 14),
  foeBullet2: makeOrb('255,180,70', 14),
  spark: makeOrb('255,255,255', 20),
  nebulaA: makeOrb('70,40,170', 240),
  nebulaB: makeOrb('20,110,150', 200)
};

/* ------------------------------ 全局状态 ------------------------------ */
const game = {
  state: 'title',          // title | playing | paused | over
  t: 0,
  score: 0,
  best: 0,                 // 仅内存保存，不落盘
  wave: 0,
  waveCd: 0,
  shake: 0,
  flash: 0,
  combo: 0,
  comboTimer: 0,
  boss: null,
  started: 0
};

const player = {
  x: W / 2, y: H - 140, vx: 0, vy: 0, r: 10,
  hp: 3, maxHp: 3, lives: 3,
  weapon: 1, bombs: 2,
  invuln: 0, alive: true,
  fireCd: 0, bombCd: 0, engine: 0, tilt: 0
};

const bullets   = [];   // {x,y,vx,vy,r,foe,dmg,sprite}
const enemies   = [];   // {kind,x,y,...}
const parts     = [];   // 粒子
const powerups  = [];   // 掉落物
const texts     = [];   // 飘分
const stars     = [];   // 星场

/* ------------------------------ 输入 ------------------------------ */
const keys = new Set();
const pointer = { active: false, x: W / 2, y: H - 140, lift: 0, id: null };

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);

  if (e.code === 'Space' || e.code === 'Enter') {
    if (game.state === 'title') { startGame(); return; }
    if (game.state === 'over')  { startGame(); return; }
    if (game.state === 'playing') { useBomb(); return; }
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (game.state === 'playing') game.state = 'paused';
    else if (game.state === 'paused') game.state = 'playing';
  }
}, { passive: false });

window.addEventListener('keyup', e => keys.delete(e.code));

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (game.state === 'title' || game.state === 'over') { startGame(); return; }
  if (game.state === 'paused') { game.state = 'playing'; return; }
  pointer.active = true;
  pointer.id = e.pointerId;
  pointer.lift = e.pointerType === 'touch' ? 62 : 0;
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
  if (e.pointerType === 'touch') {
    // 触屏按下瞬间把机身直接吸附到手指上方，避免"从老位置慢慢飘过来"
    player.x = clamp(p.x, 16, W - 16);
    player.y = clamp(p.y - pointer.lift, 40, H - 24);
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  const p = toWorld(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
}, { passive: false });

function releasePointer(e) {
  if (e && pointer.id !== null && e.pointerId !== pointer.id) return;
  pointer.active = false; pointer.id = null;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
window.addEventListener('blur', () => { keys.clear(); releasePointer(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.state === 'playing') game.state = 'paused';
});

/* ------------------------------ 星场 ------------------------------ */
function buildStars() {
  stars.length = 0;
  for (let i = 0; i < 150; i++) {
    const layer = i < 90 ? 0 : i < 130 ? 1 : 2;
    stars.push({
      x: rand(0, W), y: rand(0, H),
      sp: 26 + layer * 62 + rand(0, 18),
      r: 0.7 + layer * 0.75,
      a: 0.28 + layer * 0.28
    });
  }
}

function updateStars(dt, speedMul) {
  for (const s of stars) {
    s.y += s.sp * dt * speedMul;
    if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); }
  }
}

/* ------------------------------ 粒子与飘字 ------------------------------ */
function burst(x, y, n, color, speed, size, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(speed * 0.25, speed);
    parts.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: rand(life * 0.5, life), max: life,
      r: rand(size * 0.5, size),
      rgb: color, drag: rand(1.8, 3.4)
    });
  }
}

function ring(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * TAU;
    parts.push({
      x, y,
      vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
      life: 0.5, max: 0.5, r: 3.4, rgb: color, drag: 3.6
    });
  }
}

function popText(x, y, str, color) {
  texts.push({ x, y, str, color, life: 0.85, max: 0.85 });
}

/* ------------------------------ 敌机定义 ------------------------------ */
const ENEMY_STYLE = {
  scout:    { c: '255,95,145', r: 11, hp: 2,   score: 100 },
  weaver:   { c: '255,210,105', r: 10, hp: 3,   score: 150 },
  turret:   { c: '170,140,250', r: 15, hp: 9,   score: 320 },
  kamikaze: { c: '255,140,60', r: 11, hp: 2,   score: 180 },
  boss:     { c: '255,45,85',  r: 44, hp: 150, score: 5000 }
};

function addEnemy(kind, x, y, opts) {
  opts = opts || {};
  const st = ENEMY_STYLE[kind];
  const scale = 1 + Math.max(0, game.wave - 1) * 0.16;
  const hp = Math.max(1, Math.round(st.hp * scale));
  const e = {
    kind, x, y, x0: x,
    r: st.r, hp, maxHp: hp,
    color: st.c, score: st.score,
    vx: 0, vy: 0, t: 0,
    hitFlash: 0,
    fireCd: rand(0.7, 2.0),
    phase: rand(0, TAU),
    targetY: opts.targetY || rand(130, 270),
    dir: opts.dir || (Math.random() < 0.5 ? -1 : 1),
    enter: kind === 'boss' ? 2.0 : 0
  };
  enemies.push(e);
  return e;
}

function foeShot(x, y, ang, speed, rgb, r) {
  if (bullets.length > 420) return;
  bullets.push({
    x, y,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    r: r || 5, foe: true, dmg: 1,
    sprite: rgb === 'warm' ? SP.foeBullet2 : SP.foeBullet
  });
}

function foeAim(e, speed, spread, count) {
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  const n = count || 1;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * (spread || 0.28);
    foeShot(e.x, e.y + 8, base + off, speed, 'warm', 5.5);
  }
}

/* ------------------------------ 波次与编队 ------------------------------ */
function spawnFormation(kind, wave) {
  switch (kind) {
    case 'line':
      for (let i = 0; i < 6; i++) addEnemy('scout', 70 + i * 68, -40 - i * 6);
      break;
    case 'vee':
      for (let i = 0; i < 5; i++)
        addEnemy('scout', W / 2 + (i - 2) * 62, -46 - Math.abs(i - 2) * 46);
      break;
    case 'stream':
      for (let i = 0; i < 6; i++)
        addEnemy('weaver', rand(120, W - 120), -40 - i * 74);
      break;
    case 'pair':
      addEnemy('turret', 110, -60, { targetY: rand(140, 210) });
      addEnemy('turret', W - 110, -90, { targetY: rand(140, 210) });
      break;
  }
  if (wave >= 4 && Math.random() < 0.55) {
    for (let i = 0; i < 3; i++) addEnemy('kamikaze', rand(70, W - 70), -60 - i * 66);
  }
}

function nextWave() {
  game.wave++;
  if (game.wave % 4 === 0) { spawnBoss(); return; }
  spawnFormation(pick(['line', 'vee', 'stream', 'pair']), game.wave);
  game.waveCd = Math.max(2.4, 4.6 - game.wave * 0.22);
}

function spawnBoss() {
  const hp = Math.round(ENEMY_STYLE.boss.hp * (1 + (game.wave / 4 - 1) * 0.55));
  const b = addEnemy('boss', W / 2, -110, {});
  b.hp = b.maxHp = hp;
  b.enter = 2.2;
  b.fireCd = 1.6;
  b.spin = 0;
  game.boss = b;
  game.shake = 8;
  game.flash = 0.35;
}

/* ------------------------------ 玩家武器 ------------------------------ */
function fireWeapon() {
  const p = player;
  const lv = p.weapon;
  const speed = -700;
  const y = p.y - 14;

  const add = (dx, ang, dmg, r) => {
    bullets.push({
      x: p.x + dx, y,
      vx: Math.sin(ang) * 700, vy: Math.cos(ang) * speed,
      r: r || 3.6, foe: false, dmg: dmg || 1, sprite: SP.pBullet
    });
  };

  if (lv === 1) {
    add(0, 0, 1);
  } else if (lv === 2) {
    add(-7, 0, 1); add(7, 0, 1);
  } else if (lv === 3) {
    add(-8, 0, 1); add(8, 0, 1); add(0, 0, 1.4, 4.4);
  } else if (lv === 4) {
    add(-9, -0.10, 1); add(9, 0.10, 1);
    add(-4, 0, 1.2); add(4, 0, 1.2);
  } else {
    add(-10, -0.13, 1); add(10, 0.13, 1);
    add(-5, 0, 1.4, 4.2); add(5, 0, 1.4, 4.2);
    add(0, 0, 1.8, 5);
  }
}

function useBomb() {
  const p = player;
  if (p.bombCd > 0 || p.bombs <= 0 || !p.alive) return;
  p.bombs--;
  p.bombCd = 1.0;
  game.flash = 0.9;
  game.shake = 16;

  for (let i = bullets.length - 1; i >= 0; i--) {
    if (bullets[i].foe) {
      burst(bullets[i].x, bullets[i].y, 2, '255,200,120', 90, 2.4, 0.4);
      bullets.splice(i, 1);
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    damageEnemy(e, e.kind === 'boss' ? 26 : 6, true);
  }
  ring(p.x, p.y, '120,240,255', 34);
  ring(p.x, p.y, '255,255,255', 18);
}

/* ------------------------------ 伤害与掉落 ------------------------------ */
function addScore(v, x, y) {
  const mult = 1 + Math.min(4, Math.floor(game.combo / 6));
  const gained = Math.round(v * mult);
  game.score += gained;
  if (x !== undefined) popText(x, y, (mult > 1 ? 'x' + mult + ' ' : '') + gained, mult > 1 ? '255,220,120' : '180,240,255');
}

function damageEnemy(e, dmg, silent) {
  if (e.dead) return;
  e.hp -= dmg;
  e.hitFlash = 0.09;
  if (!silent) burst(e.x, e.y, 2, e.color, 110, 2.2, 0.3);

  if (e.hp <= 0) {
    e.dead = true;
    killEnemy(e);
  }
}

function killEnemy(e) {
  const isBoss = e.kind === 'boss';
  game.combo++;
  game.comboTimer = 2.2;
  addScore(e.score, e.x, e.y - 10);

  if (isBoss) {
    game.shake = 22; game.flash = 0.75; game.boss = null;
    burst(e.x, e.y, 90, '255,180,90', 420, 6, 1.1);
    burst(e.x, e.y, 50, '255,255,255', 260, 4, 0.9);
    ring(e.x, e.y, '255,90,120', 30);
    ring(e.x, e.y, '255,220,150', 22);
    for (let i = 0; i < 3; i++) dropPowerup(e.x + rand(-50, 50), e.y + rand(-30, 30));
    game.waveCd = 2.0;
  } else {
    game.shake = Math.max(game.shake, 4);
    burst(e.x, e.y, 16, e.color, 240, 3.6, 0.6);
    burst(e.x, e.y, 6, '255,255,255', 150, 2.6, 0.45);
    ring(e.x, e.y, e.color, 8);
    if (Math.random() < 0.13) dropPowerup(e.x, e.y);
  }
}

function dropPowerup(x, y) {
  const roll = Math.random();
  const type = roll < 0.58 ? 'W' : roll < 0.82 ? 'H' : 'B';
  powerups.push({ x, y, vy: 78, t: 0, r: 12, type });
}

function collectPowerup(pu) {
  const p = player;
  if (pu.type === 'W') {
    if (p.weapon < 5) { p.weapon++; popText(p.x, p.y - 26, '火力 LV' + p.weapon, '120,240,255'); }
    else { addScore(500, p.x, p.y - 26); }
  } else if (pu.type === 'H') {
    if (p.hp < p.maxHp) { p.hp++; popText(p.x, p.y - 26, '修复 +1', '120,255,170'); }
    else { addScore(500, p.x, p.y - 26); }
  } else {
    if (p.bombs < 3) { p.bombs++; popText(p.x, p.y - 26, '炸弹 +1', '255,210,120'); }
    else { addScore(500, p.x, p.y - 26); }
  }
  burst(pu.x, pu.y, 14, '160,255,255', 200, 3, 0.5);
}

function hurtPlayer() {
  const p = player;
  if (p.invuln > 0 || !p.alive) return;

  p.hp--;
  p.invuln = 1.5;
  game.shake = 12;
  game.flash = 0.3;
  game.combo = 0;
  burst(p.x, p.y, 20, '120,220,255', 240, 3.6, 0.6);

  if (p.hp <= 0) {
    p.alive = false;
    p.lives--;
    game.shake = 20; game.flash = 0.6;
    burst(p.x, p.y, 60, '120,220,255', 420, 5.5, 1.0);
    burst(p.x, p.y, 30, '255,255,255', 260, 4, 0.8);
    ring(p.x, p.y, '120,220,255', 26);
    p.weapon = Math.max(1, p.weapon - 1);

    if (p.lives <= 0) {
      setTimeout(gameOver, 700);
    } else {
      setTimeout(respawn, 900);
    }
  }
}

function respawn() {
  if (game.state !== 'playing') return;
  const p = player;
  p.alive = true;
  p.hp = p.maxHp;
  p.invuln = 2.6;
  p.x = W / 2; p.y = H - 140;
  p.vx = 0; p.vy = 0;
  pointer.active = false;
  ring(p.x, p.y, '120,240,255', 22);
}

function gameOver() {
  if (game.state !== 'playing') return;
  game.state = 'over';
  game.best = Math.max(game.best, game.score);
}

/* ------------------------------ 玩家更新 ------------------------------ */
function updatePlayer(dt) {
  const p = player;
  if (p.engine !== undefined) p.engine += dt;
  if (p.bombCd > 0) p.bombCd -= dt;
  if (!p.alive) return;

  if (p.invuln > 0) p.invuln -= dt;

  const ACC = 3000, MAXV = 430;
  let ax = 0, ay = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) ax -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) ax += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) ay -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) ay += 1;

  if (ax || ay) {
    pointer.active = false;
    const m = Math.hypot(ax, ay) || 1;
    p.vx += (ax / m) * ACC * dt;
    p.vy += (ay / m) * ACC * dt;
  } else if (pointer.active) {
    const tx = clamp(pointer.x, 16, W - 16);
    const ty = clamp(pointer.y - pointer.lift, 40, H - 24);
    const k = 1 - Math.pow(0.0004, dt);
    const nx = lerp(p.x, tx, k);
    const ny = lerp(p.y, ty, k);
    p.vx = (nx - p.x) / Math.max(dt, 1e-4);
    p.vy = (ny - p.y) / Math.max(dt, 1e-4);
    p.x = nx; p.y = ny;
  } else {
    const f = Math.pow(0.0025, dt);
    p.vx *= f; p.vy *= f;
  }

  const sp = Math.hypot(p.vx, p.vy);
  if (sp > MAXV) { p.vx = p.vx / sp * MAXV; p.vy = p.vy / sp * MAXV; }

  const px = clamp(p.x + p.vx * dt, 16, W - 16);
  const py = clamp(p.y + p.vy * dt, 40, H - 24);
  if (px !== p.x + p.vx * dt) p.vx *= -0.2;
  if (py !== p.y + p.vy * dt) p.vy *= -0.2;
  p.x = px; p.y = py;

  p.tilt = lerp(p.tilt, clamp(p.vx / MAXV, -1, 1), 1 - Math.pow(0.001, dt));

  // 自动开火
  p.fireCd -= dt;
  if (p.fireCd <= 0) {
    p.fireCd = 0.098;
    fireWeapon();
    burst(p.x, p.y + 12, 1, '120,220,255', 60, 1.8, 0.2);
  }
}

/* ------------------------------ 敌人更新 ------------------------------ */
function updateBoss(e, dt) {
  e.spin += dt;

  if (e.enter > 0) {
    e.enter -= dt;
    e.y = lerp(e.y, 158, 1 - Math.pow(0.02, dt));
    return;
  }

  const ratio = e.hp / e.maxHp;
  const phase = ratio > 0.62 ? 0 : ratio > 0.3 ? 1 : 2;

  e.x = W / 2 + Math.sin(e.spin * (0.55 + phase * 0.22)) * (120 + phase * 18);
  e.y = 158 + Math.sin(e.spin * 1.25) * 16;

  e.fireCd -= dt;
  if (e.fireCd > 0) return;

  if (phase === 0) {
    e.fireCd = 1.15;
    foeAim(e, 250, 0.24, 3);
  } else if (phase === 1) {
    e.fireCd = 1.35;
    const n = 14;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + e.spin * 0.8;
      foeShot(e.x, e.y, a, 185, 'pink', 5.5);
    }
  } else {
    e.fireCd = 0.14;
    const a = e.spin * 2.6;
    for (let i = 0; i < 3; i++) {
      foeShot(e.x, e.y, a + (i / 3) * TAU, 205, 'pink', 5);
    }
  }
}

function updateEnemy(e, dt) {
  e.t += dt;
  if (e.hitFlash > 0) e.hitFlash -= dt;

  switch (e.kind) {
    case 'scout': {
      e.y += (92 + game.wave * 5) * dt;
      e.x += Math.sin(e.t * 1.3 + e.phase) * 34 * dt;
      e.fireCd -= dt;
      if (e.fireCd <= 0 && e.y > 30 && e.y < H * 0.72) {
        e.fireCd = rand(1.5, 2.5);
        foeAim(e, 235, 0.2, 1);
      }
      break;
    }
    case 'weaver': {
      e.y += (175 + game.wave * 7) * dt;
      e.x = e.x0 + Math.sin(e.t * 2.3 + e.phase) * 72;
      break;
    }
    case 'turret': {
      if (e.y < e.targetY) {
        e.y += 115 * dt;
      } else {
        e.x += e.dir * 74 * dt;
        if (e.x < 58) { e.x = 58; e.dir = 1; }
        if (e.x > W - 58) { e.x = W - 58; e.dir = -1; }
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          e.fireCd = 1.45;
          foeAim(e, 210, 0.30, 3);
        }
      }
      break;
    }
    case 'kamikaze': {
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      const spd = 275;
      e.vx = lerp(e.vx, Math.cos(a) * spd, 1 - Math.pow(0.12, dt));
      e.vy = lerp(e.vy, Math.sin(a) * spd, 1 - Math.pow(0.12, dt));
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (Math.random() < dt * 30) burst(e.x, e.y - 6, 1, '255,150,70', 40, 1.8, 0.25);
      break;
    }
    case 'boss':
      updateBoss(e, dt);
      break;
  }
}

/* ------------------------------ 主更新 ------------------------------ */
function update(dt) {
  game.t += dt;
  game.shake = Math.max(0, game.shake - dt * 42);
  game.flash = Math.max(0, game.flash - dt * 2.6);
  if (game.comboTimer > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) game.combo = 0;
  }

  const speedMul = game.state === 'playing' ? 1 : 0.45;
  updateStars(dt, speedMul);

  // 粒子
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    const f = Math.pow(0.5, dt * p.drag);
    p.vx *= f; p.vy *= f;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }

  // 飘字
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    t.y -= 42 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }

  if (game.state !== 'playing') return;

  updatePlayer(dt);

  // 波次调度
  if (!game.boss) {
    game.waveCd -= dt;
    if (game.waveCd <= 0 && enemies.length < 34) nextWave();
  }

  // 子弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) { bullets.splice(i, 1); continue; }

    if (b.foe) {
      if (player.alive && player.invuln <= 0 && hit(b, player)) {
        bullets.splice(i, 1);
        hurtPlayer();
      }
    } else {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (e.enter > 0) continue;
        if (hit(b, e)) {
          bullets.splice(i, 1);
          damageEnemy(e, b.dmg);
          break;
        }
      }
    }
  }

  // 敌机
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    updateEnemy(e, dt);

    if (e.dead) { enemies.splice(i, 1); continue; }

    if (e.kind !== 'boss') {
      if (e.y > H + 90 || e.x < -160 || e.x > W + 160) { enemies.splice(i, 1); continue; }
      if (player.alive && player.invuln <= 0 && hit(e, player)) {
        damageEnemy(e, 999);
        hurtPlayer();
        continue;
      }
    } else if (player.alive && player.invuln <= 0 && e.enter <= 0 && hit(e, player)) {
      hurtPlayer();
    }
  }

  // 掉落物
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.t += dt;
    pu.y += pu.vy * dt;
    pu.x += Math.sin(pu.t * 2.2) * 26 * dt;
    if (pu.y > H + 30) { powerups.splice(i, 1); continue; }
    if (player.alive && hit(pu, player)) {
      powerups.splice(i, 1);
      collectPowerup(pu);
    }
  }
}

/* ------------------------------ 渲染：背景 ------------------------------ */
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070a1c');
  g.addColorStop(0.55, '#0a0618');
  g.addColorStop(1, '#120a20');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星云
  ctx.globalAlpha = 0.5;
  const offA = (game.t * 9) % (H + 520) - 260;
  const offB = (game.t * 6) % (H + 460) - 230;
  ctx.drawImage(SP.nebulaA, 60 - 240, offA - 240, 480, 480);
  ctx.drawImage(SP.nebulaB, W - 80 - 200, offB - 200, 400, 400);
  ctx.globalAlpha = 1;

  // 星点
  for (const s of stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = s.r > 1.6 ? '#cfe9ff' : '#8fb6d8';
    ctx.fillRect(s.x, s.y, s.r, s.r * (1 + s.sp / 90));
  }
  ctx.globalAlpha = 1;

  // 滚动网格线
  ctx.globalAlpha = 0.055;
  ctx.strokeStyle = '#5fd8ff';
  ctx.lineWidth = 1;
  const gap = 64;
  const off = (game.t * 52) % gap;
  ctx.beginPath();
  for (let y = off; y < H; y += gap) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* ------------------------------ 渲染：玩家 ------------------------------ */
function drawPlayer() {
  const p = player;
  if (!p.alive) return;

  const blink = p.invuln > 0 && Math.floor(p.invuln * 18) % 2 === 0;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.tilt * 0.16);
  if (blink) ctx.globalAlpha = 0.32;

  // 引擎尾焰
  const f = 14 + Math.sin(p.engine * 34) * 5;
  ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createLinearGradient(0, 8, 0, 8 + f * 2.4);
  fg.addColorStop(0, 'rgba(150,245,255,0.95)');
  fg.addColorStop(0.4, 'rgba(80,160,255,0.55)');
  fg.addColorStop(1, 'rgba(60,90,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-5.5, 8); ctx.lineTo(5.5, 8); ctx.lineTo(0, 8 + f * 2.4);
  ctx.closePath(); ctx.fill();

  // 侧翼光晕
  ctx.globalAlpha = (blink ? 0.32 : 1) * 0.5;
  ctx.drawImage(SP.pBullet, -34, -12, 68, 34);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = blink ? 0.32 : 1;

  // 机身
  ctx.shadowColor = 'rgba(90,235,255,0.95)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#eafcff';
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(5.5, -4);
  ctx.lineTo(15, 6);
  ctx.lineTo(6.5, 5);
  ctx.lineTo(4.5, 11);
  ctx.lineTo(-4.5, 11);
  ctx.lineTo(-6.5, 5);
  ctx.lineTo(-15, 6);
  ctx.lineTo(-5.5, -4);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // 机身高光
  ctx.fillStyle = 'rgba(120,240,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(0, -15); ctx.lineTo(3, -2); ctx.lineTo(-3, -2);
  ctx.closePath(); ctx.fill();

  // 驾驶舱
  ctx.fillStyle = '#1f6dff';
  ctx.beginPath(); ctx.ellipse(0, -3.5, 3.4, 6.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#9ff8ff';
  ctx.beginPath(); ctx.ellipse(0, -5.5, 1.7, 3.1, 0, 0, TAU); ctx.fill();

  // 无敌护盾
  if (p.invuln > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const a = 0.20 + Math.sin(game.t * 16) * 0.10;
    ctx.strokeStyle = 'rgba(120,240,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.6).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();
}

/* ------------------------------ 渲染：敌机 ------------------------------ */
function enemyPath(kind) {
  ctx.beginPath();
  if (kind === 'turret') {
    ctx.moveTo(0, 18);  ctx.lineTo(13, 8);   ctx.lineTo(19, -6);
    ctx.lineTo(9, -14); ctx.lineTo(0, -8);   ctx.lineTo(-9, -14);
    ctx.lineTo(-19, -6);ctx.lineTo(-13, 8);
  } else if (kind === 'weaver') {
    ctx.moveTo(0, 14);  ctx.lineTo(13, -1);  ctx.lineTo(5, -12);
    ctx.lineTo(0, -6);  ctx.lineTo(-5, -12); ctx.lineTo(-13, -1);
  } else {
    ctx.moveTo(0, 13);  ctx.lineTo(11, -3);  ctx.lineTo(5, -11);
    ctx.lineTo(0, -5);  ctx.lineTo(-5, -11); ctx.lineTo(-11, -3);
  }
  ctx.closePath();
}

function drawEnemy(e) {
  const flash = e.hitFlash > 0;

  if (e.kind === 'boss') { drawBoss(e, flash); return; }

  ctx.save();
  ctx.translate(e.x, e.y);
  const tilt = e.kind === 'weaver' ? Math.cos(e.t * 2.3 + e.phase) * 0.34 : 0;
  ctx.rotate(tilt);

  ctx.shadowColor = 'rgba(' + e.color + ',0.9)';
  ctx.shadowBlur = flash ? 26 : 12;
  ctx.fillStyle = flash ? '#ffffff' : 'rgba(' + e.color + ',0.95)';
  enemyPath(e.kind);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = flash ? '#ffffff' : 'rgba(10,8,22,0.72)';
  ctx.beginPath();
  if (e.kind === 'turret') {
    ctx.arc(0, 0, 6, 0, TAU);
  } else {
    ctx.moveTo(0, 9); ctx.lineTo(3.6, -2); ctx.lineTo(-3.6, -2);
    ctx.closePath();
  }
  ctx.fill();

  if (!flash) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(0, e.kind === 'turret' ? 0 : 2, 2, 0, TAU); ctx.fill();
  }

  // 小血条
  if (e.hp < e.maxHp) {
    const w = e.r * 2.2, h = 2.6;
    const x = -w / 2, y = -e.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(' + e.color + ',0.95)';
    ctx.fillRect(x, y, w * (e.hp / e.maxHp), h);
  }

  ctx.restore();
}

function drawBoss(e, flash) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const pulse = 1 + Math.sin(e.t * 3) * 0.02;
  ctx.scale(pulse, pulse);

  ctx.shadowColor = 'rgba(255,45,85,0.95)';
  ctx.shadowBlur = flash ? 40 : 22;

  // 外壳
  ctx.fillStyle = flash ? '#ffffff' : '#2a0a1c';
  ctx.beginPath();
  ctx.moveTo(0, 46);   ctx.lineTo(34, 26);  ctx.lineTo(56, -6);
  ctx.lineTo(40, -34); ctx.lineTo(14, -24); ctx.lineTo(0, -34);
  ctx.lineTo(-14, -24);ctx.lineTo(-40, -34);ctx.lineTo(-56, -6);
  ctx.lineTo(-34, 26);
  ctx.closePath();
  ctx.fill();

  // 装甲板
  ctx.shadowBlur = 0;
  ctx.fillStyle = flash ? '#ffffff' : 'rgba(255,45,85,0.85)';
  ctx.beginPath();
  ctx.moveTo(0, 36);   ctx.lineTo(26, 18);  ctx.lineTo(40, -8);
  ctx.lineTo(26, -26); ctx.lineTo(0, -18);  ctx.lineTo(-26, -26);
  ctx.lineTo(-40, -8); ctx.lineTo(-26, 18);
  ctx.closePath();
  ctx.fill();

  // 核心
  ctx.globalCompositeOperation = 'lighter';
  const cs = 26 + Math.sin(e.t * 6) * 4;
  ctx.drawImage(SP.spark, -cs, -cs, cs * 2, cs * 2);
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#ffe6ee';
  ctx.beginPath(); ctx.ellipse(0, 2, 11, 15, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff2d55';
  ctx.beginPath(); ctx.ellipse(0, 2, 6, 9, 0, 0, TAU); ctx.fill();

  // 炮口
  ctx.fillStyle = '#ffd166';
  for (const sx of [-44, 44]) {
    ctx.beginPath(); ctx.arc(sx, 4, 5, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // 首领血条
  if (e.enter <= 0) {
    const w = 300, x = (W - w) / 2, y = 22;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - 2, y - 2, w + 4, 12);
    const grd = ctx.createLinearGradient(x, 0, x + w, 0);
    grd.addColorStop(0, '#ff2d55');
    grd.addColorStop(1, '#ffb347');
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, w * clamp(e.hp / e.maxHp, 0, 1), 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 2.5, y - 2.5, w + 5, 13);
  }
}

/* ------------------------------ 渲染：子弹/粒子/掉落 ------------------------------ */
function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    const w = b.r * 4.4, h = b.foe ? b.r * 4.4 : b.r * 6.2;
    ctx.drawImage(b.sprite, b.x - w / 2, b.y - h / 2, w, h);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.r * 5 * (0.4 + k * 0.6);
    ctx.globalAlpha = k;
    ctx.drawImage(SP.spark, p.x - s, p.y - s, s * 2, s * 2);
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPowerups() {
  const COLORS = { W: '90,240,255', H: '90,255,170', B: '255,200,90' };
  const LABEL  = { W: '火', H: '修', B: '弹' };
  for (const pu of powerups) {
    const c = COLORS[pu.type];
    const pulse = 1 + Math.sin(pu.t * 5) * 0.12;
    ctx.globalCompositeOperation = 'lighter';
    const s = pu.r * 2.6 * pulse;
    ctx.drawImage(SP.spark, pu.x - s, pu.y - s, s * 2, s * 2);
    ctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.rotate(Math.sin(pu.t * 2) * 0.3);
    ctx.strokeStyle = 'rgba(' + c + ',1)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(' + c + ',1)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -pu.r); ctx.lineTo(pu.r, 0);
    ctx.lineTo(0, pu.r);  ctx.lineTo(-pu.r, 0);
    ctx.closePath();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(' + c + ',0.22)';
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(LABEL[pu.type], 0, 0.5);
    ctx.restore();
  }
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of texts) {
    const k = clamp(t.life / t.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(' + t.color + ',1)';
    ctx.shadowColor = 'rgba(' + t.color + ',0.9)';
    ctx.shadowBlur = 10;
    ctx.fillText(t.str, t.x, t.y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

/* ------------------------------ 渲染：HUD ------------------------------ */
function drawHUD() {
  const p = player;

  // 顶部渐隐条
  const g = ctx.createLinearGradient(0, 0, 0, 70);
  g.addColorStop(0, 'rgba(4,6,16,0.85)');
  g.addColorStop(1, 'rgba(4,6,16,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 70);

  // 分数
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 26px "DIN Alternate","Menlo",monospace';
  ctx.fillStyle = '#eafcff';
  ctx.shadowColor = 'rgba(90,235,255,0.9)';
  ctx.shadowBlur = 12;
  ctx.fillText(String(game.score).padStart(6, '0'), 16, 14);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 10px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(150,200,225,0.8)';
  ctx.fillText('SCORE', 17, 44);

  // 连击
  if (game.combo > 1) {
    const mult = 1 + Math.min(4, Math.floor(game.combo / 6));
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,215,120,0.95)';
    ctx.shadowColor = 'rgba(255,190,90,0.9)';
    ctx.shadowBlur = 10;
    ctx.fillText('连击 ' + game.combo + (mult > 1 ? '  x' + mult : ''), W / 2, 18);
    ctx.shadowBlur = 0;
  }

  // 生命（右上）
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  for (let i = 0; i < 3; i++) {
    const x = W - 18 - i * 20, y = 18;
    const on = i < p.lives;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, 7); ctx.lineTo(6.5, -1); ctx.lineTo(3, -8);
    ctx.lineTo(0, -3); ctx.lineTo(-3, -8); ctx.lineTo(-6.5, -1);
    ctx.closePath();
    if (on) {
      ctx.fillStyle = '#7ff6ff';
      ctx.shadowColor = 'rgba(90,235,255,0.9)';
      ctx.shadowBlur = 10;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(120,180,200,0.35)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 血量条
  ctx.shadowBlur = 0;
  const barW = 118, barX = W - 18 - barW, barY = 40;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(barX, barY, barW, 5);
  ctx.fillStyle = p.hp > 1 ? 'rgba(120,240,255,0.95)' : 'rgba(255,110,140,0.95)';
  ctx.fillRect(barX, barY, barW * (p.hp / p.maxHp), 5);

  // 火力等级
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 10px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(150,200,225,0.8)';
  ctx.fillText('POWER', 17, H - 30);
  for (let i = 0; i < 5; i++) {
    const x = 66 + i * 13, y = H - 30;
    const on = i < p.weapon;
    ctx.fillStyle = on ? 'rgba(120,240,255,0.95)' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y - 4, 9, 8);
  }

  // 炸弹
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150,200,225,0.8)';
  ctx.fillText('BOMB', W - 18, H - 30);
  for (let i = 0; i < 3; i++) {
    const x = W - 60 + i * 16, y = H - 30;
    const on = i < p.bombs;
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, TAU);
    ctx.fillStyle = on ? 'rgba(255,205,110,0.95)' : 'rgba(255,255,255,0.12)';
    ctx.fill();
  }

  // 波次
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(140,190,215,0.75)';
  ctx.fillText('WAVE ' + Math.max(1, game.wave), W / 2, H - 30);
}

/* ------------------------------ 渲染：覆盖层 ------------------------------ */
function drawTitle() {
  const t = game.t;

  ctx.font = 'bold 13px "Menlo",monospace';
  ctx.fillStyle = 'rgba(130,220,245,0.75)';
  ctx.fillText('T  H  U  N  D  E  R     F  I  G  H  T  E  R', W / 2, y + 46);

  // 装饰线
  ctx.strokeStyle = 'rgba(90,235,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 130, y + 68); ctx.lineTo(W / 2 + 130, y + 68);

  ctx.globalAlpha = 1;

  ctx.font = '13px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(160,200,220,0.7)';
  ctx.fillText('拖拽移动 · 自动开火 · 空格放炸弹 · P 暂停', W / 2, H - 200);

  ctx.fillStyle = 'rgba(160,200,220,0.5)';
  ctx.font = '12px "PingFang SC",sans-serif';
  ctx.fillText('WASD / 方向键 也可以操控', W / 2, H - 176);

  if (game.best > 0) {
    ctx.fillStyle = 'rgba(255,215,120,0.9)';
    ctx.font = 'bold 14px "PingFang SC",sans-serif';
    ctx.fillText('本次最高 ' + game.best, W / 2, H - 130);
  }
}

function drawOver() {
  ctx.fillStyle = 'rgba(4,6,16,0.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.save();
  ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.shadowColor = 'rgba(255,70,110,0.9)';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#ffe9ef';
  ctx.fillText('任 务 失 败', W / 2, 250);
  ctx.restore();

  ctx.font = 'bold 13px "Menlo",monospace';
  ctx.fillStyle = 'rgba(255,140,170,0.8)';
  ctx.fillText('G  A  M  E     O  V  E  R', W / 2, 296);

  ctx.font = 'bold 40px "DIN Alternate","Menlo",monospace';
  ctx.fillStyle = '#eafcff';
  ctx.shadowColor = 'rgba(90,235,255,0.9)';
  ctx.shadowBlur = 16;
  ctx.fillText(String(game.score), W / 2, 386);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 12px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(150,200,225,0.8)';
  ctx.fillText('最终得分', W / 2, 420);

  ctx.font = 'bold 15px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,215,120,0.95)';
  ctx.fillText('最高分  ' + game.best, W / 2, 462);

  ctx.font = 'bold 14px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(160,205,225,0.85)';
  ctx.fillText('抵达  WAVE ' + Math.max(1, game.wave), W / 2, 496);

  const a = 0.5 + Math.sin(game.t * 3.2) * 0.45;
  ctx.globalAlpha = a;
  ctx.font = 'bold 16px "PingFang SC",sans-serif';
  ctx.fillStyle = '#8ff3ff';
  ctx.fillText('点击 / 空格  再来一局', W / 2, 590);
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(4,6,16,0.68)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#eafcff';
  ctx.shadowColor = 'rgba(90,235,255,0.9)';
  ctx.shadowBlur = 20;
  ctx.fillText('已 暂 停', W / 2, H / 2 - 16);
  ctx.shadowBlur = 0;
  ctx.font = '14px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(160,205,225,0.85)';
  ctx.fillText('按 P / ESC 继续', W / 2, H / 2 + 34);
}

/* ------------------------------ 主渲染 ------------------------------ */
function render() {
  // 清屏（设备空间）
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 世界变换（含震屏）
  const sh = game.shake;
  const sx = sh ? rand(-sh, sh) : 0;
  const sy = sh ? rand(-sh, sh) : 0;
  ctx.setTransform(view.s, 0, 0, view.s, view.ox + sx * view.dpr, view.oy + sy * view.dpr);

  ctx.save();
  ctx.beginPath();
  ctx.rect(-40, -40, W + 80, H + 80);
  ctx.clip();

  drawBackground();

  // 掉落物在敌机之下
  drawPowerups();

  for (const e of enemies) drawEnemy(e);

  drawBullets();
  drawParticles();
  drawPlayer();
  drawTexts();

  ctx.restore();

  // 世界边框光
  ctx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
  ctx.strokeStyle = 'rgba(90,235,255,0.10)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

  // 覆盖层与 HUD
  if (game.state === 'playing' || game.state === 'paused') drawHUD();
  if (game.state === 'title')  drawTitle();
  if (game.state === 'over')   drawOver();
  if (game.state === 'paused') drawPaused();

  // 白闪
  if (game.flash > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(150,220,255,' + (game.flash * 0.55).toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
  }

  // CRT 扫描线 + 暗角
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (scanPattern) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = scanPattern;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  }
  const vg = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.28,
    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.78
  );
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

/* ------------------------------ 生命周期 ------------------------------ */
function startGame() {
  bullets.length = 0;
  enemies.length = 0;
  parts.length = 0;
  powerups.length = 0;
  texts.length = 0;

  game.state = 'playing';
  game.score = 0;
  game.wave = 0;
  game.waveCd = 1.2;
  game.shake = 0;
  game.flash = 0;
  game.combo = 0;
  game.comboTimer = 0;
  game.boss = null;
  game.started = game.t;

  player.x = W / 2; player.y = H - 140;
  player.vx = 0; player.vy = 0;
  player.hp = player.maxHp;
  player.lives = 3;
  player.weapon = 1;
  player.bombs = 2;
  player.invuln = 2.2;
  player.alive = true;
  player.fireCd = 0;
  player.bombCd = 0;
  player.tilt = 0;

  pointer.active = false;
  ring(player.x, player.y, '120,240,255', 20);
}

let last = performance.now();
let acc = 0;

function frame(now) {
  const raw = (now - last) / 1000;
  last = now;
  const dt = Math.min(raw, 1 / 24);   // 掉帧保护，避免穿模
  acc += dt;

  update(dt);
  render();

  requestAnimationFrame(frame);
}

/* ------------------------------ 启动 ------------------------------ */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

resize();
buildStars();
requestAnimationFrame(frame);

})();
</script>
