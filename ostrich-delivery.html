<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>鸵鸟外卖 · 极速配送</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b2e52;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
'use strict';

const cv  = document.getElementById('scene');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* ================================================================== *
 *  utils
 * ================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const hash  = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function spring(p, v, k, c, dt, target) {
  target = target || 0;
  const sub = 2, h = dt / sub;
  for (let i = 0; i < sub; i++) {
    v += (-k * (p - target) - c * v) * h;
    p += v * h;
  }
  return [p, v];
}

/* ================================================================== *
 *  palette — luminous dusk sky, dark silhouettes, bright hero
 * ================================================================== */
const P = {
  /* sky */
  sky0:'#1A2C52', sky1:'#2F5F80', sky2:'#5E93A0', sky3:'#C3A87E', sky4:'#E8935A', sky5:'#FFC86E',
  sun:'#FFE9B0', sunCore:'#FFF7E0',
  cloud:'rgba(255,246,224,.18)',

  /* distant silhouettes (light → dark with depth) */
  far:'#2C4A5E',
  mid:'#1D3140', mid2:'#233B4C',
  win:'#FFC46B', winOff:'rgba(10,22,30,.50)',

  /* ground */
  side:'#37505E', sideTop:'#46626F',
  road:'#263A44', roadDark:'#16242C',
  dash:'#FFD98A',

  /* near silhouettes */
  tree:'#0E1F29', tree2:'#1A3340', trunk:'#0B1A22',
  lamp:'#101F29', glow:'#FFE9B0',

  /* hero */
  cream:'#FBEFDD', creamSh:'#E2CCB0',
  skin:'#E8A860', skinSh:'#B8804A',
  yellow:'#FFC93C', yellowSh:'#E3A61F', yellowDk:'#9E6F14',
  red:'#EE5C4D', redSh:'#B33E33',
  tire:'#0E1A21', rim:'#FBEFDD',
  beak:'#F08A2E', ink:'#0B1A22', white:'#FFFDF6'
};

/* ================================================================== *
 *  layout / state
 * ================================================================== */
let W = 0, H = 0, DPR = 1;
let horizonY = 0, roadTop = 0, groundY = 0, roadBottom = 0, R = 26, riderX = 0;

let t = 0, scroll = 0, wheelAng = 0, crankAng = 0, speed = 600;

let jumpY = 0, jumpV = 0, airborne = false, rampAir = false;
let neckA = 0, neckV = 0;
let boxA  = 0, boxV  = 0;
let sqA   = 0, sqV   = 0;
let tiltA = 0, tiltV = 0;
let cq = 0, cqV = 0;                       /* crouch amount */
let shake = 0, boxTimer = 2.4;
let dust = [], dustTimer = 0;

const G = 2400, JUMPV = 880;

/* ---- game state ---- */
let mode = 'title';                        /* title | playing | dying | paused | over */
let hearts = 3, inv = 0, dipT = 0, slipT = 0, redFlash = 0, dieT = 0;
let runScroll = 0, playT = 0, coinCount = 0, bonus = 0, best = 0, lastMile = 0;
let newBest = false, overAt = 0;
let obstacles = [], coinsA = [], debris = [], floaters = [];
let nextAt = 0, lastWx = 0, spawnInit = false;

/* ---- input ---- */
let leftKey = false, rightKey = false, jumpKey = false, crouchKey = false;
let jumpPressAt = -9;
const ptrMap = new Map();
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  horizonY   = H * 0.585;
  roadTop    = H * 0.700;
  groundY    = H * 0.775;
  roadBottom = H * 0.925;
  R = clamp(Math.min(H * 0.050, W * 0.029), 12, 48);
  riderX = clamp(riderX || W * 0.330, W * 0.12, W * 0.58);
}

/* ================================================================== *
 *  parallax tile helper
 * ================================================================== */
function layer(period, factor, fn) {
  const p    = scroll * factor;
  const off  = p % period;
  const base = Math.floor(p / period);
  const n    = Math.ceil(W / period) + 2;
  for (let i = 0; i < n; i++) {
    const idx = base + i - 1;
    fn((i - 1) * period - off, idx);   // == idx*period - p
  }
}

/* ================================================================== *
 *  background
 * ================================================================== */
function drawSky() {
  const g = ctx.createLinearGradient(0, -8, 0, horizonY + 6);
  g.addColorStop(0.00, P.sky0);
  g.addColorStop(0.34, P.sky1);
  g.addColorStop(0.58, P.sky2);
  g.addColorStop(0.78, P.sky3);
  g.addColorStop(0.91, P.sky4);
  g.addColorStop(1.00, P.sky5);
  ctx.fillStyle = g;
  ctx.fillRect(-10, -10, W + 20, horizonY + 8);

  // sun
  const sx = W * 0.715, sy = horizonY - H * 0.155, sr = H * 0.072;
  const halo = ctx.createRadialGradient(sx, sy, sr * 0.7, sx, sy, sr * 3.6);
  halo.addColorStop(0, 'rgba(255,226,160,.34)');
  halo.addColorStop(1, 'rgba(255,226,160,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 3.6, 0, TAU); ctx.fill();
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  ctx.fillStyle = P.sunCore;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 0.62, 0, TAU); ctx.fill();

  // flat clouds
  ctx.fillStyle = P.cloud;
  layer(1500, 0.012, (x, idx) => {
    const y = horizonY * (0.10 + 0.42 * hash(idx * 9.1));
    const w = 130 + 200 * hash(idx * 4.3);
    const h = 10 + 10 * hash(idx * 6.7);
    rr(x, y, w, h, h / 2); ctx.fill();
    rr(x + w * 0.24, y - h * 0.68, w * 0.46, h * 0.95, h * 0.45); ctx.fill();
  });

  // distant birds
  ctx.strokeStyle = 'rgba(20,36,52,.42)';
  ctx.lineWidth = Math.max(1.4, H * 0.0022);
  ctx.lineCap = 'round';
  layer(900, 0.03, (x, idx) => {
    if (hash(idx * 8.3) < 0.45) return;
    const y = horizonY * (0.10 + 0.34 * hash(idx * 2.9));
    const s = H * (0.008 + 0.007 * hash(idx * 5.5));
    for (let i = 0; i < 3; i++) {
      const bx = x + i * s * 3.4, by = y + Math.sin(i * 1.9) * s * 1.6;
      ctx.beginPath();
      ctx.moveTo(bx - s, by + s * 0.55);
      ctx.quadraticCurveTo(bx, by - s * 0.35, bx + s, by + s * 0.55);
      ctx.stroke();
    }
  });
}

function drawFar() {
  ctx.fillStyle = P.far;
  layer(720, 0.05, (x, idx) => {
    const h = H * (0.06 + 0.15 * hash(idx * 1.7));
    const w = 720 * (0.42 + 0.42 * hash(idx * 3.1));
    ctx.fillRect(x, horizonY - h, w, h + 4);
    if (hash(idx * 5.3) > 0.58) {
      ctx.fillRect(x + w * 0.5 - 1.5, horizonY - h - H * 0.05, 3, H * 0.05);
    }
  });
}

function drawMid() {
  const sunX = W * 0.715;
  layer(520, 0.15, (x, idx) => {
    const w = 520 * (0.50 + 0.38 * hash(idx * 4.7));
    // keep the skyline low around the sun so the disc stays readable
    const dk = clamp(Math.abs(x + w / 2 - sunX) / (W * 0.21), 0, 1);
    const h = H * (0.09 + 0.15 * hash(idx * 2.3)) * (0.42 + 0.58 * dk);
    ctx.fillStyle = hash(idx * 6.1) > 0.5 ? P.mid : P.mid2;
    ctx.fillRect(x, horizonY - h, w, h + 4);

    ctx.fillStyle = 'rgba(6,16,24,.5)';
    ctx.fillRect(x, horizonY - h, w, 5);

    // irregular window grid: per-building pitch, jittered, three lit tones
    const gw = 9 + 5 * hash(idx * 7.9), gh = 12 + 6 * hash(idx * 5.7);
    const gx = 9 + 5 * hash(idx * 3.3), gy = 11 + 6 * hash(idx * 9.1);
    const cols = clamp(Math.floor((w - 22) / (gw + gx)), 1, 10);
    const rows = clamp(Math.floor((h - 22) / (gh + gy)), 1, 12);
    const ox = x + (w - (cols * gw + (cols - 1) * gx)) / 2;
    const oy = horizonY - h + 12;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const v = hash(idx * 13.7 + r * 7.13 + c * 3.31);
        if (v < 0.26) continue;                       // some windows dark
        ctx.fillStyle = v > 0.72 ? P.win : (v > 0.52 ? '#E8A44E' : P.winOff);
        ctx.fillRect(ox + c * (gw + gx), oy + r * (gh + gy), gw, gh);
      }
    }
  });
}

function drawGround() {
  // sidewalk band
  ctx.fillStyle = P.side;
  ctx.fillRect(-10, horizonY, W + 20, roadTop - horizonY + 2);
  ctx.fillStyle = P.sideTop;
  ctx.fillRect(-10, horizonY, W + 20, 5);

  // paving ticks
  ctx.fillStyle = 'rgba(8,20,28,.30)';
  layer(150, 0.72, (x) => { ctx.fillRect(x, horizonY + 8, 3, roadTop - horizonY - 10); });

  // curb
  ctx.fillStyle = '#0F1E28';
  ctx.fillRect(-10, roadTop - 8, W + 20, 8);
  ctx.fillStyle = 'rgba(255,217,138,.30)';
  ctx.fillRect(-10, roadTop - 8, W + 20, 2.5);
}

function drawTrees() {
  layer(330, 0.55, (x, idx) => {
    const s = 0.80 + 0.45 * hash(idx * 1.31);
    const th = H * 0.275 * s;
    const tw = Math.max(3, th * 0.048);
    const baseY = roadTop + 3;

    ctx.fillStyle = P.trunk;
    ctx.beginPath();
    ctx.moveTo(x - tw, baseY);
    ctx.lineTo(x + tw, baseY);
    ctx.lineTo(x + tw * 0.55, baseY - th * 0.58);
    ctx.lineTo(x - tw * 0.55, baseY - th * 0.58);
    ctx.closePath(); ctx.fill();

    const cy = baseY - th * 0.74;
    if (hash(idx * 2.77) > 0.28) {
      const r = th * 0.30;
      ctx.fillStyle = P.tree;
      ctx.beginPath();
      ctx.arc(x - r * 0.84, cy + r * 0.26, r, 0, TAU);
      ctx.arc(x + r * 0.84, cy + r * 0.26, r, 0, TAU);
      ctx.arc(x,            cy - r * 0.62, r * 1.10, 0, TAU);
      ctx.fill();
      ctx.fillStyle = P.tree2;
      ctx.beginPath(); ctx.arc(x - r * 0.18, cy - r * 0.86, r * 0.58, 0, TAU); ctx.fill();
    } else {
      // layered conifer, not a bare triangle
      ctx.fillStyle = P.tree;
      for (let i = 0; i < 3; i++) {
        const k = i * 0.16;
        const hw = th * (0.26 - k * 0.06), hy = cy - th * (0.50 - k * 0.22);
        ctx.beginPath();
        ctx.moveTo(x, hy - th * 0.10);
        ctx.quadraticCurveTo(x + hw * 0.7, hy + th * 0.14, x + hw, hy + th * 0.26);
        ctx.lineTo(x - hw, hy + th * 0.26);
        ctx.quadraticCurveTo(x - hw * 0.7, hy + th * 0.14, x, hy - th * 0.10);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = P.tree2;
      ctx.beginPath();
      ctx.moveTo(x, cy - th * 0.60);
      ctx.quadraticCurveTo(x + th * 0.09, cy - th * 0.34, x + th * 0.13, cy - th * 0.24);
      ctx.lineTo(x, cy - th * 0.24);
      ctx.closePath(); ctx.fill();
    }
  });
}

function drawLamps() {
  layer(330, 0.55, (x, idx) => {
    const px = x + 165;
    const s  = 0.92 + 0.16 * hash(idx * 3.9);
    const h  = H * 0.30 * s;
    const topY = roadTop + 3 - h;

    ctx.fillStyle = P.lamp;
    ctx.fillRect(px - 3 * s, topY, 6 * s, h);
    // arm
    ctx.beginPath();
    ctx.moveTo(px - 3 * s, topY);
    ctx.quadraticCurveTo(px + 20 * s, topY - 5 * s, px + 33 * s, topY + 7 * s);
    ctx.lineTo(px + 33 * s, topY + 11 * s);
    ctx.quadraticCurveTo(px + 17 * s, topY + 2 * s, px + 3 * s, topY + 4 * s);
    ctx.closePath(); ctx.fill();
    // lamp head: lit, fixed size so all lamps match
    ctx.fillStyle = P.glow;
    rr(px + 26 * s, topY + 5 * s, 17, 8, 4); ctx.fill();
    ctx.fillStyle = P.lamp;
    rr(px + 26 * s, topY + 12 * s, 17, 3.5, 1.5); ctx.fill();

    ctx.fillStyle = P.glow; ctx.globalAlpha = 0.34;
    ctx.beginPath(); ctx.arc(px + 34 * s, topY + 11 * s, 14 * s, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawRoad() {
  ctx.fillStyle = P.road;
  ctx.fillRect(-10, roadTop, W + 20, roadBottom - roadTop + 2);

  // far lane dashes
  ctx.fillStyle = P.dash; ctx.globalAlpha = 0.34;
  layer(155, 0.78, (x) => { rr(x, groundY + 32, 78, 5, 2.5); ctx.fill(); });

  // near lane dashes
  ctx.globalAlpha = 0.80;
  layer(190, 1.0, (x) => { rr(x, roadBottom - 32, 76, 8, 4); ctx.fill(); });
  ctx.globalAlpha = 1;

  ctx.fillStyle = P.roadDark;
  ctx.fillRect(-10, roadBottom, W + 20, H - roadBottom + 14);
}

/* ================================================================== *
 *  obstacles — drawing
 * ================================================================== */
function drawObstacles() {
  const u = R;
  for (const o of obstacles) {
    const x = o.wx - scroll;
    if (x < -14 * u || x > W + 14 * u) continue;
    switch (o.kind) {
      case 'bump':    drawBump(x, u);            break;
      case 'cone':    drawCone(x, u);            break;
      case 'bin':     drawBin(x, u);             break;
      case 'barrier': drawBarrier(x, u, o.seed); break;
      case 'crates':  drawCrates(x, u, o.seed);  break;
      case 'puddle':  drawPuddle(x, u, o.seed);  break;
      case 'lowbar':  drawLowbar(x, u, o);       break;
      case 'pigeons': drawFlock(x, u, o);        break;
    }
  }
}

function drawBump(x, u) {
  const w = u * 3.2, h = u * 0.58;
  const y0 = groundY - h * 0.5, y1 = groundY + h * 1.05;
  const x0 = x - w / 2, x1 = x + w / 2;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0, y1);
  ctx.lineTo(x0 + w * 0.16, y0);
  ctx.lineTo(x1 - w * 0.16, y0);
  ctx.lineTo(x1, y1);
  ctx.closePath();
  ctx.fillStyle = P.yellow; ctx.fill();
  ctx.clip();

  ctx.fillStyle = P.ink; ctx.globalAlpha = 0.90;
  const sw = w * 0.135;
  for (let i = -2; i < 12; i++) {
    const px = x0 + i * sw * 2;
    ctx.beginPath();
    ctx.moveTo(px, y1 + 4);
    ctx.lineTo(px + sw, y1 + 4);
    ctx.lineTo(px + sw + h * 1.0, y0 - 6);
    ctx.lineTo(px + h * 1.0, y0 - 6);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,.40)';
  ctx.fillRect(x0 + w * 0.17, y0, w * 0.66, 2.5);
}

function drawCone(x, u) {
  const h = 1.35 * u, bw = 0.75 * u, tw = 0.28 * u, y1 = groundY;
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u * 0.06);
  ctx.lineJoin = 'round';

  ctx.fillStyle = '#D9622B';
  rr(x - bw * 1.35, y1 - 0.18 * u, bw * 2.7, 0.22 * u, 0.09 * u);
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x - bw, y1 - 0.12 * u);
  ctx.lineTo(x - tw, y1 - h);
  ctx.lineTo(x + tw, y1 - h);
  ctx.lineTo(x + bw, y1 - 0.12 * u);
  ctx.closePath();
  ctx.fillStyle = '#FF8A3D'; ctx.fill(); ctx.stroke();

  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,253,246,.92)';
  ctx.fillRect(x - bw, y1 - h * 0.66, bw * 2, h * 0.22);
  ctx.restore();

  ctx.fillStyle = '#FF8A3D';
  rr(x - tw * 1.2, y1 - h - 0.12 * u, tw * 2.4, 0.14 * u, 0.06 * u);
  ctx.fill(); ctx.stroke();
}

function drawBin(x, u) {
  const w = 2.1 * u, h = 2.4 * u, y1 = groundY;
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u * 0.065);
  ctx.lineJoin = 'round';

  ctx.fillStyle = '#3E7C64';
  rr(x - w / 2, y1 - h, w, h, 0.18 * u);
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = 'rgba(11,26,34,.35)';
  ctx.lineWidth = Math.max(1, u * 0.05);
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * w * 0.22, y1 - h + 0.35 * u);
    ctx.lineTo(x + i * w * 0.22, y1 - 0.25 * u);
    ctx.stroke();
  }

  // lid, slightly ajar
  ctx.save();
  ctx.translate(x, y1 - h);
  ctx.rotate(-0.10);
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u * 0.065);
  ctx.fillStyle = '#2C5A49';
  rr(-w / 2 - 0.10 * u, -0.36 * u, w + 0.2 * u, 0.32 * u, 0.14 * u);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = P.ink;
  rr(-0.3 * u, -0.50 * u, 0.6 * u, 0.13 * u, 0.06 * u); ctx.fill();
  ctx.restore();
}

function drawBarrier(x, u, seed) {
  const w = 4.2 * u, y1 = groundY;
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u * 0.055);
  ctx.lineJoin = 'round';

  // A-frame legs
  ctx.fillStyle = '#B9C2C9';
  for (const s of [-1, 1]) {
    const lx = x + s * 1.55 * u;
    ctx.beginPath();
    ctx.moveTo(lx - 0.26 * u, y1);
    ctx.lineTo(lx - 0.06 * u, y1);
    ctx.lineTo(lx + 0.08 * u, y1 - 1.9 * u);
    ctx.lineTo(lx - 0.12 * u, y1 - 1.9 * u);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // striped plank
  const py = y1 - 2.05 * u, ph = 0.62 * u, pw = w;
  ctx.save();
  rr(x - pw / 2, py, pw, ph, 0.10 * u);
  ctx.fillStyle = P.yellow; ctx.fill();
  ctx.clip();
  ctx.fillStyle = P.ink;
  const sw = 0.55 * u;
  for (let i = -4; i < 10; i++) {
    const px = x - pw / 2 + i * sw * 2;
    ctx.beginPath();
    ctx.moveTo(px, py + ph + 2);
    ctx.lineTo(px + sw, py + ph + 2);
    ctx.lineTo(px + sw + ph * 0.9, py - 2);
    ctx.lineTo(px + ph * 0.9, py - 2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06);
  rr(x - pw / 2, py, pw, ph, 0.10 * u); ctx.stroke();

  // blinking amber light
  const blink = Math.sin(t * 7 + seed) > 0.1;
  if (blink) {
    ctx.fillStyle = 'rgba(255,177,61,.30)';
    ctx.beginPath(); ctx.arc(x, py - 0.20 * u, 0.42 * u, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = blink ? '#FFB13D' : '#7A5A22';
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.05);
  ctx.beginPath(); ctx.arc(x, py - 0.18 * u, 0.14 * u, 0, TAU);
  ctx.fill(); ctx.stroke();
}

function drawCrate(cx, botY, w, h, variant) {
  ctx.fillStyle = '#EFDDBC';
  rr(cx - w / 2, botY - h, w, h, 0.12 * u0());
  ctx.fill();
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u0() * 0.06);
  ctx.lineJoin = 'round';
  ctx.stroke();
  // tape
  ctx.fillStyle = variant === 1 ? P.red : P.yellow;
  if (variant === 2) {
    ctx.save();
    ctx.beginPath(); rr(cx - w / 2, botY - h, w, h, 0.12 * u0()); ctx.clip();
    ctx.fillRect(cx - w * 0.5, botY - h * 0.52, w, h * 0.16);
    ctx.restore();
  } else {
    ctx.fillRect(cx - w * 0.07, botY - h + 0.06 * u0(), w * 0.14, h - 0.12 * u0());
  }
  // corner shading
  ctx.fillStyle = 'rgba(11,26,34,.12)';
  ctx.fillRect(cx + w * 0.30, botY - h + 0.08 * u0(), w * 0.16, h - 0.16 * u0());
}
function u0() { return R; }

function drawCrates(x, u, seed) {
  const y1 = groundY;
  drawCrate(x, y1, 2.5 * u, 2.25 * u, 0);
  drawCrate(x - 0.14 * u, y1 - 2.22 * u, 2.1 * u, 2.05 * u, 1);
  ctx.save();
  ctx.translate(x - 1.35 * u, y1 - 0.06 * u);
  ctx.rotate(0.42);
  drawCrate(0, 0.06 * u, 1.5 * u, 1.4 * u, 2);
  ctx.restore();
}

function drawPuddle(x, u, seed) {
  const w = 3.4 * u, h = 0.46 * u;
  ctx.fillStyle = '#22475A';
  ctx.beginPath();
  ctx.ellipse(x, groundY + 0.08 * u, w / 2, h / 2, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(11,26,34,.45)';
  ctx.lineWidth = Math.max(1, u * 0.05);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,201,110,.28)';
  ctx.beginPath();
  ctx.ellipse(x + Math.sin(t * 1.7 + seed) * w * 0.10, groundY + 0.04 * u, w * 0.26, h * 0.16, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,246,224,.20)';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.18, groundY + 0.14 * u, w * 0.12, h * 0.12, 0, 0, TAU);
  ctx.fill();
}

function drawLowbar(x, u, o) {
  const hw = 2.7 * u, y1 = groundY;
  const poleTop = y1 - 9.9 * u;

  ctx.fillStyle = P.ink;
  for (const s of [-1, 1]) {
    rr(x + s * hw - 0.10 * u, poleTop, 0.20 * u, 9.9 * u, 0.08 * u); ctx.fill();
  }
  rr(x - hw - 0.24 * u, poleTop - 0.18 * u, (hw + 0.24 * u) * 2, 0.24 * u, 0.10 * u); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(x + s * hw, poleTop - 0.20 * u, 0.14 * u, 0, TAU); ctx.fill();
  }

  const bTop = y1 - 9.5 * u, bBot = y1 - 6.9 * u;
  const bw = (hw - 0.25 * u) * 2, bh = bBot - bTop;
  const wave = Math.sin(t * 2.6 + o.seed) * 0.045;

  ctx.save();
  ctx.translate(x, bTop);
  ctx.rotate(wave);
  ctx.lineJoin = 'round';

  const cloth = () => {
    ctx.beginPath();
    ctx.moveTo(-bw / 2, 0);
    ctx.lineTo(bw / 2, 0);
    const n = 4, sw = bw / n;
    for (let i = 0; i < n; i++) {
      ctx.quadraticCurveTo(bw / 2 - sw * (i + 0.5), bh + 0.24 * u, bw / 2 - sw * (i + 1), bh);
    }
    ctx.closePath();
  };

  if (!o.torn) {
    cloth();
    ctx.fillStyle = P.cream; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = P.red;
    const sw2 = 0.62 * u;
    for (let i = -3; i < 9; i++) {
      const px = -bw / 2 + i * sw2 * 2;
      ctx.beginPath();
      ctx.moveTo(px, bh + 6);
      ctx.lineTo(px + sw2, bh + 6);
      ctx.lineTo(px + sw2 + bh * 0.8, -6);
      ctx.lineTo(px + bh * 0.8, -6);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    cloth();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = Math.max(1, u * 0.06);
    ctx.stroke();
  } else {
    // torn strip with jagged edge + two hanging shreds
    ctx.beginPath();
    ctx.moveTo(-bw / 2, 0);
    ctx.lineTo(bw / 2, 0);
    const jag = 6;
    for (let i = jag; i >= 0; i--) {
      ctx.lineTo(bw / 2 - bw * i / jag, 0.45 * u + 0.55 * u * hash(o.seed * 3.1 + i * 2.7));
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(251,239,221,.90)'; ctx.fill();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = Math.max(1, u * 0.055);
    ctx.stroke();

    for (const s of [-0.55, 0.35]) {
      const sx = s * bw * 0.8;
      ctx.beginPath();
      ctx.moveTo(sx, 0.2 * u);
      ctx.quadraticCurveTo(sx + 0.10 * u, 1.2 * u, sx - 0.06 * u, 1.7 * u + hash(o.seed + s * 9) * 0.5 * u);
      ctx.lineTo(sx + 0.18 * u, 1.5 * u);
      ctx.quadraticCurveTo(sx + 0.22 * u, 0.7 * u, sx + 0.18 * u, 0.2 * u);
      ctx.closePath();
      ctx.fillStyle = 'rgba(251,239,221,.75)'; ctx.fill();
      ctx.stroke();
    }
  }
  ctx.restore();
}

function pigeonPos(o, i, screenX, u) {
  const bx = screenX + (i - 1) * 1.25 * u + Math.sin(t * 0.9 + i * 2.1) * 0.2 * u;
  const by = groundY - (6.8 - 0.7 * hash(o.seed * 1.7 + i * 3.1)) * u
           + Math.sin(t * 2.6 + i * 1.7) * 0.18 * u;
  return { x: bx, y: by };
}

function drawPigeon(px, py, u, seed) {
  const flap = Math.sin(t * 16 + seed * 3);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-0.06 + flap * 0.04);
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1, u * 0.05);
  ctx.lineJoin = 'round';

  // tail (bird faces left)
  ctx.fillStyle = '#8B98A3';
  ctx.beginPath();
  ctx.moveTo(0.5 * u, -0.05 * u);
  ctx.lineTo(1.05 * u, -0.18 * u);
  ctx.lineTo(1.0 * u, 0.10 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // body
  ctx.fillStyle = '#AEB9C2';
  ctx.beginPath(); ctx.ellipse(0, 0, 0.62 * u, 0.40 * u, -0.08, 0, TAU); ctx.fill(); ctx.stroke();

  // head + beak + eye
  ctx.fillStyle = '#AEB9C2';
  ctx.beginPath(); ctx.arc(-0.55 * u, -0.22 * u, 0.24 * u, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(-0.76 * u, -0.28 * u);
  ctx.lineTo(-1.0 * u, -0.21 * u);
  ctx.lineTo(-0.76 * u, -0.15 * u);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.arc(-0.60 * u, -0.27 * u, 0.05 * u, 0, TAU); ctx.fill();

  // flapping wing
  ctx.save();
  ctx.translate(0.05 * u, -0.12 * u);
  ctx.rotate(-0.5 - flap * 0.55);
  ctx.fillStyle = '#96A3AD';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(0.5 * u, -0.55 * u, 0.95 * u, -0.30 * u);
  ctx.quadraticCurveTo(0.45 * u, 0.05 * u, 0, 0.12 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawFlock(x, u, o) {
  for (let i = 0; i < 3; i++) {
    const p = pigeonPos(o, i, x, u);
    drawPigeon(p.x, p.y, u, o.seed + i * 7.3);
  }
}

/* ================================================================== *
 *  coins / pickups
 * ================================================================== */
function heartPath(cx, cy, s) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s);
  ctx.bezierCurveTo(cx - 1.5 * s, cy + 0.15 * s, cx - 1.15 * s, cy - 0.95 * s, cx, cy - 0.30 * s);
  ctx.bezierCurveTo(cx + 1.15 * s, cy - 0.95 * s, cx + 1.5 * s, cy + 0.15 * s, cx, cy + s);
  ctx.closePath();
}

function drawCoins() {
  const u = R;
  for (const c of coinsA) {
    const x = c.wx - scroll;
    if (c.got || x < -4 * u || x > W + 4 * u) continue;
    const bob = Math.sin(t * 2.8 + c.phase) * 0.12 * u;
    const y = groundY - c.h * u - 0.62 * u + bob;

    if (c.heart) {
      const hy = y + Math.sin(t * 3 + c.phase) * 0.1 * u;
      ctx.fillStyle = 'rgba(255,90,78,.22)';
      ctx.beginPath(); ctx.arc(x, hy, 1.0 * u, 0, TAU); ctx.fill();
      heartPath(x, hy, 0.62 * u);
      ctx.fillStyle = '#FF5A4E'; ctx.fill();
      ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(x - 0.22 * u, hy - 0.28 * u, 0.13 * u, 0, TAU); ctx.fill();
      continue;
    }

    const sx = Math.max(Math.abs(Math.cos(t * 3.6 + c.phase)), 0.14);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sx, 1);
    ctx.fillStyle = 'rgba(255,201,60,.16)';
    ctx.beginPath(); ctx.arc(0, 0, 1.05 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = P.yellow;
    ctx.beginPath(); ctx.arc(0, 0, 0.62 * u, 0, TAU); ctx.fill();
    ctx.strokeStyle = P.yellowDk; ctx.lineWidth = Math.max(1.2, u * 0.09); ctx.stroke();
    ctx.fillStyle = P.yellowSh;
    ctx.beginPath(); ctx.arc(0, 0, 0.40 * u, 0, TAU); ctx.fill();
    ctx.fillStyle = P.white;
    ctx.beginPath();
    ctx.moveTo(0.10 * u, -0.30 * u);
    ctx.lineTo(-0.14 * u, 0.04 * u);
    ctx.lineTo(0.00 * u, 0.04 * u);
    ctx.lineTo(-0.10 * u, 0.30 * u);
    ctx.lineTo(0.16 * u, -0.06 * u);
    ctx.lineTo(0.02 * u, -0.06 * u);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ================================================================== *
 *  streaks / foreground / dust
 * ================================================================== */
function drawAirStreaks() {
  ctx.fillStyle = P.dash;
  layer(235, 1.30, (x, idx) => {
    ctx.globalAlpha = 0.04 + hash(idx * 3.33) * 0.11;
    const y = groundY - H * 0.36 * hash(idx * 7.71) + H * 0.02;
    const len = 40 + 190 * hash(idx * 5.11);
    rr(x, y, len, Math.max(1.6, R * (0.03 + 0.035 * hash(idx * 2.7))), 3); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawForeground() {
  // near-side hedge, flying past faster than the road (sits below the rig)
  ctx.fillStyle = '#09141C';
  layer(380, 1.55, (x, idx) => {
    const y0 = H * 0.925;
    const w = 300 + 240 * hash(idx * 3.1);
    const h = 30 + 56 * hash(idx * 5.3);
    ctx.beginPath();
    ctx.moveTo(x - 24, H + 12);
    ctx.lineTo(x - 24, y0 + h * 0.52);
    ctx.quadraticCurveTo(x + w * 0.16, y0 - h * 0.38, x + w * 0.36, y0 + h * 0.14);
    ctx.quadraticCurveTo(x + w * 0.54, y0 - h * 0.42, x + w * 0.72, y0 + h * 0.08);
    ctx.quadraticCurveTo(x + w * 0.88, y0 - h * 0.30, x + w + 24, y0 + h * 0.46);
    ctx.lineTo(x + w + 24, H + 12);
    ctx.closePath(); ctx.fill();
  });

  ctx.fillStyle = P.dash;
  layer(330, 1.75, (x, idx) => {
    ctx.globalAlpha = 0.10 + hash(idx * 3.37) * 0.16;
    const y = roadBottom + (H - roadBottom) * (0.08 + 0.80 * hash(idx * 7.77));
    const len = 70 + 260 * hash(idx * 5.13);
    rr(x, y, len, Math.max(2, R * (0.06 + 0.05 * hash(idx * 8.9))), 3); ctx.fill();
  });
  layer(520, 2.15, (x, idx) => {
    ctx.globalAlpha = 0.08 + hash(idx * 4.71) * 0.13;
    const y = H - (H - roadBottom) * (0.12 + 0.62 * hash(idx * 2.13));
    const len = 140 + 320 * hash(idx * 6.31);
    rr(x, y, len, Math.max(2.4, R * 0.10), 4); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function puff(x, y, n, spread, up) {
  for (let i = 0; i < n; i++) {
    const ang = rand(-Math.PI, 0);
    dust.push({
      x: x + rand(-spread, spread),
      y: y + rand(-2, 3),
      vx: Math.cos(ang) * rand(20, 110) - rand(0, 40),
      vy: Math.sin(ang) * rand(20, 90) * (up || 1),
      r: rand(2, 5) * (R / 40) + 1.5,
      life: 0, max: rand(0.32, 0.72)
    });
  }
}

function drawDust() {
  for (const d of dust) {
    const a = 1 - d.life / d.max;
    ctx.globalAlpha = a * a * 0.38;
    ctx.fillStyle = P.cream;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (0.5 + a * 0.9), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---- debris (obstacle chunks, feathers, sparkles) ---- */
function burst(x, y, n, cols, spread, opt) {
  opt = opt || {};
  for (let i = 0; i < n; i++) {
    debris.push({
      x: x + rand(-spread, spread),
      y: y + rand(-spread * 0.5, spread * 0.5),
      vx: rand(-260, 260) * (R / 40),
      vy: rand(-430, -60) * (R / 40) * (opt.up || 1),
      rot: rand(0, TAU), rv: rand(-9, 9),
      w: rand(3, 9) * (R / 40) + 2,
      h: rand(3, 7) * (R / 40) + 2,
      col: cols[(Math.random() * cols.length) | 0],
      life: 0, max: opt.max || rand(0.5, 0.95),
      g: opt.g === undefined ? 1 : opt.g
    });
  }
}
function sparkle(x, y, cols) { burst(x, y, 7, cols, R * 0.5, { g: 0.25, max: 0.42 }); }

function drawDebris() {
  for (const d of debris) {
    const a = 1 - d.life / d.max;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.fillStyle = d.col;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of floaters) {
    const a = 1 - Math.pow(f.life / f.max, 2);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.font = 'bold ' + f.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(11,26,34,.55)';
    ctx.fillText(f.txt, f.x + 1.5, f.y + 2);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

/* ================================================================== *
 *  rig parts
 * ================================================================== */
function drawWheel(cx, cy, r, ang) {
  ctx.save();
  ctx.translate(cx, cy);

  // tire
  ctx.fillStyle = P.tire;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();

  // rotating spokes + hub + rim ring
  ctx.save();
  ctx.rotate(ang);
  ctx.strokeStyle = P.rim;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.2, r * 0.11);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.54, 0, TAU); ctx.stroke();
  ctx.lineWidth = Math.max(1.2, r * 0.12);
  for (let i = 0; i < 3; i++) {
    const a = i * TAU / 3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.08, Math.sin(a) * r * 0.08);
    ctx.lineTo(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52);
    ctx.stroke();
  }
  ctx.fillStyle = P.rim;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawLeg(hip, foot, L1, L2, color, footColor, u, lw) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const d = clamp(len, Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const knee = { x: hip.x + a * ux - h * uy, y: hip.y + a * uy + h * ux };

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = lw * 1.30;
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(knee.x, knee.y); ctx.stroke();
  ctx.lineWidth = lw * 0.95;
  ctx.beginPath(); ctx.moveTo(knee.x, knee.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();

  // bird foot: pad + two toes
  ctx.save();
  ctx.translate(foot.x, foot.y);
  ctx.rotate(0.08);
  ctx.fillStyle = footColor;
  rr(-u * 0.30, -u * 0.18, u * 0.78, u * 0.34, u * 0.16); ctx.fill();
  rr(u * 0.30, -u * 0.10, u * 0.30, u * 0.20, u * 0.09); ctx.fill();
  ctx.restore();
}

function drawBox(u) {
  const w = 2.95 * u, h = 2.45 * u;
  const x = -w / 2, y = -h / 2;

  ctx.fillStyle = P.yellow;
  rr(x, y, w, h, u * 0.22); ctx.fill();

  // lid
  ctx.fillStyle = '#F2BB33';
  rr(x, y, w, h * 0.24, u * 0.20); ctx.fill();
  ctx.fillStyle = P.yellowDk;
  ctx.fillRect(x + u * 0.10, y + h * 0.24, w - u * 0.20, u * 0.09);

  // side highlight
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x + u * 0.14, y + h * 0.42, u * 0.22, h * 0.44);

  // logo plate + bolt
  ctx.fillStyle = P.ink;
  rr(-u * 0.60, -u * 0.02, u * 1.20, u * 1.20, u * 0.27); ctx.fill();
  ctx.fillStyle = P.white;
  ctx.beginPath();
  ctx.moveTo(u * 0.24, -u * 0.00);
  ctx.lineTo(-u * 0.28, u * 0.62);
  ctx.lineTo(-u * 0.01, u * 0.62);
  ctx.lineTo(-u * 0.19, u * 1.12);
  ctx.lineTo(u * 0.34, u * 0.47);
  ctx.lineTo(u * 0.05, u * 0.47);
  ctx.closePath(); ctx.fill();

  // outline
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1.1, u * 0.07);
  rr(x, y, w, h, u * 0.22); ctx.stroke();
}

/* ================================================================== *
 *  the ostrich + scooter
 * ================================================================== */
function drawShadow() {
  const k = R / 40;
  const air = clamp(1 - jumpY / (R * 3.2), 0.30, 1);
  ctx.save();
  ctx.globalAlpha = 0.46 * air;
  ctx.fillStyle = '#0D1A21';
  ctx.beginPath();
  ctx.ellipse(riderX + 0.10 * R, groundY + 4 * k,
              4.5 * R * (0.74 + 0.26 * air), 0.40 * R * (0.55 + 0.45 * air), 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawRig() {
  const u  = R;
  const k  = u / 40;
  const bob = Math.sin(t * 17) * 1.15 * k;
  const sq  = clamp(sqA, -0.35, 0.40);
  const LW = Math.max(1.1, u * 0.075);

  ctx.save();
  ctx.translate(riderX, groundY - jumpY + bob);
  if (inv > 0 && Math.sin(t * 28) > 0) ctx.globalAlpha = 0.35;   // hit blink
  ctx.rotate(tiltA);
  ctx.scale(1 + sq * 0.45, 1 - sq);
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  const O = P.ink;

  /* ---- geometry ---- */
  const rw  = { x: -2.50 * u, y: -u,        r: u };
  const fw  = { x:  2.60 * u, y: -0.92 * u, r: 0.92 * u };
  const cc  = { x: -0.35 * u, y: -2.05 * u };
  const cr  = 0.50 * u;
  const hip = { x: -1.40 * u, y: -4.70 * u };
  const L1 = 2.05 * u, L2 = 1.90 * u;

  const pNear = { x: cc.x + Math.cos(crankAng) * cr,           y: cc.y + Math.sin(crankAng) * cr };
  const pFar  = { x: cc.x + Math.cos(crankAng + Math.PI) * cr, y: cc.y + Math.sin(crankAng + Math.PI) * cr };

  /* ---- far leg (behind the whole scooter) ---- */
  drawLeg(hip, pFar, L1, L2, P.skinSh, P.skinSh, u, u * 0.30);

  /* ---- wheels ---- */
  drawWheel(rw.x, rw.y, rw.r, wheelAng);
  drawWheel(fw.x, fw.y, fw.r, wheelAng);

  /* ---- fenders ---- */
  ctx.strokeStyle = P.redSh;
  ctx.lineWidth = u * 0.30;
  ctx.beginPath(); ctx.arc(rw.x, rw.y, rw.r * 1.15, -Math.PI * 0.97, -Math.PI * 0.08); ctx.stroke();
  ctx.beginPath(); ctx.arc(fw.x, fw.y, fw.r * 1.17, -Math.PI * 0.97, -Math.PI * 0.08); ctx.stroke();

  /* ---- deck (short, so both wheel tops stay visible) ---- */
  ctx.fillStyle = P.red;
  rr(-1.95 * u, -1.58 * u, 3.90 * u, 0.62 * u, 0.26 * u); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW;
  rr(-1.95 * u, -1.58 * u, 3.90 * u, 0.62 * u, 0.26 * u); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(-1.70 * u, -1.53 * u, 3.40 * u, 0.12 * u);

  /* ---- slanted seat post + saddle ---- */
  ctx.fillStyle = P.red;
  ctx.beginPath();
  ctx.moveTo(-1.78 * u, -1.52 * u);
  ctx.lineTo(-1.34 * u, -1.52 * u);
  ctx.lineTo(-1.92 * u, -4.08 * u);
  ctx.lineTo(-2.36 * u, -4.08 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = P.redSh;
  rr(-2.58 * u, -4.48 * u, 1.80 * u, 0.46 * u, 0.22 * u); ctx.fill(); ctx.stroke();

  /* ---- steering column ---- */
  ctx.fillStyle = P.red;
  ctx.beginPath();
  ctx.moveTo(1.72 * u, -1.58 * u);
  ctx.lineTo(2.30 * u, -1.58 * u);
  ctx.lineTo(2.98 * u, -5.55 * u);
  ctx.lineTo(2.52 * u, -5.55 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* ---- handlebar (bright, so it reads) ---- */
  ctx.fillStyle = P.cream;
  rr(1.98 * u, -5.85 * u, 1.50 * u, 0.36 * u, 0.18 * u); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW * 0.9;
  rr(1.98 * u, -5.85 * u, 1.50 * u, 0.36 * u, 0.18 * u); ctx.stroke();
  ctx.fillStyle = P.ink;
  rr(3.18 * u, -5.90 * u, 0.44 * u, 0.46 * u, 0.20 * u); ctx.fill();

  /* ---- headlight ---- */
  ctx.fillStyle = P.glow; ctx.globalAlpha *= 0.62;
  ctx.beginPath(); ctx.arc(3.02 * u, -4.72 * u, 0.70 * u, 0, TAU); ctx.fill();
  ctx.globalAlpha = (inv > 0 && Math.sin(t * 28) > 0) ? 0.35 : 1;
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(3.02 * u, -4.72 * u, 0.30 * u, 0, TAU); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW * 0.8; ctx.stroke();

  /* ---- crank + pedals ---- */
  ctx.strokeStyle = '#4C6270';
  ctx.lineWidth = u * 0.20;
  ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.lineTo(pFar.x, pFar.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.lineTo(pNear.x, pNear.y); ctx.stroke();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.arc(cc.x, cc.y, u * 0.22, 0, TAU); ctx.fill();

  const pedal = (p, col) => {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = col;
    rr(-u * 0.34, -u * 0.15, u * 0.68, u * 0.30, u * 0.12); ctx.fill();
    ctx.strokeStyle = O; ctx.lineWidth = LW * 0.7;
    rr(-u * 0.34, -u * 0.15, u * 0.68, u * 0.30, u * 0.12); ctx.stroke();
    ctx.restore();
  };
  pedal(pFar, P.redSh);

  /* ---- near leg ---- */
  drawLeg(hip, pNear, L1, L2, P.skin, P.skin, u, u * 0.32);
  pedal(pNear, P.yellow);

  /* ================================================================
   *  bird body group — squashes toward the deck when crouching
   * ================================================================ */
  ctx.save();
  ctx.translate(0, -1.50 * u);
  ctx.scale(1 + cq * 0.14, 1 - cq * 0.44);
  ctx.translate(0, 1.50 * u);

  /* ---- tail feathers ---- */
  ctx.fillStyle = P.creamSh;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(-3.35 * u, -6.05 * u + i * 0.50 * u);
    ctx.rotate(-0.26 - i * 0.22);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-1.45 * u, -0.28 * u, -1.85 * u, 0.22 * u);
    ctx.quadraticCurveTo(-1.10 * u, 0.34 * u, 0, 0.28 * u);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---- body ---- */
  const bx = -1.20 * u, by = -6.50 * u, brx = 2.62 * u, bry = 2.50 * u, brot = -0.05;

  ctx.fillStyle = P.cream;
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.fill();

  // vest: clipped to the body, front shoulder raised to the neck
  const vestTop = (m) => {
    ctx.moveTo(bx - brx * 1.1, by - 0.28 * u);
    ctx.quadraticCurveTo(bx - 0.62 * u, by + 0.48 * u, bx + 0.05 * u, by + 0.18 * u);
    ctx.quadraticCurveTo(bx + 0.95 * u, by - 0.16 * u, bx + 1.42 * u, by - 1.02 * u);
    ctx.quadraticCurveTo(bx + 2.02 * u, by + 0.30 * u, bx + brx * 1.1, by + 0.55 * u);
  };
  ctx.save();
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.clip();
  ctx.fillStyle = P.yellow;
  ctx.beginPath();
  vestTop();
  ctx.lineTo(bx + brx * 1.1, by + bry * 1.5);
  ctx.lineTo(bx - brx * 1.1, by + bry * 1.5);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = P.yellowDk;
  ctx.lineWidth = Math.max(1.6, u * 0.11);
  ctx.beginPath(); vestTop(); ctx.stroke();

  // chest badge
  ctx.fillStyle = P.yellowDk;
  rr(bx + 0.62 * u, by + 0.72 * u, 0.66 * u, 0.66 * u, 0.15 * u); ctx.fill();
  ctx.restore();

  // body outline
  ctx.strokeStyle = O;
  ctx.lineWidth = Math.max(1.3, u * 0.09);
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.stroke();

  // collar, sitting on the vest's raised front shoulder
  ctx.fillStyle = P.yellowSh;
  ctx.beginPath();
  ctx.ellipse(bx + 1.42 * u, by - 1.02 * u, 0.52 * u, 0.30 * u, -0.30, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = Math.max(1.1, u * 0.07); ctx.stroke();

  /* ---- box straps (under the box, over the body) ---- */
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = u * 0.24;
  ctx.globalAlpha *= 0.85;
  ctx.beginPath();
  ctx.moveTo(-3.55 * u, -8.15 * u); ctx.lineTo(-2.85 * u, -6.05 * u);
  ctx.moveTo(-2.05 * u, -8.15 * u); ctx.lineTo(-1.75 * u, -6.05 * u);
  ctx.stroke();
  ctx.globalAlpha = (inv > 0 && Math.sin(t * 28) > 0) ? 0.35 : 1;

  /* ---- delivery box ---- */
  ctx.save();
  ctx.translate(-2.90 * u, -9.10 * u + boxA);
  ctx.rotate(-0.10 + boxA * 0.0016);
  drawBox(u);
  ctx.restore();

  /* ---- neck + head ---- */
  const neckAngle = 0.135 * Math.sin(t * 3.4) + neckA;
  ctx.save();
  ctx.translate(0.85 * u, -7.60 * u);
  ctx.rotate(neckAngle);
  drawNeckHead(u, LW);
  ctx.restore();

  /* ---- wing: reaching for the bars, or tucked when crouching ---- */
  if (cq < 0.5) {
    ctx.strokeStyle = P.yellow;
    ctx.lineWidth = u * 0.60;
    ctx.beginPath();
    ctx.moveTo(1.30 * u, -5.95 * u);
    ctx.quadraticCurveTo(2.05 * u, -6.10 * u, 2.55 * u, -5.68 * u);
    ctx.stroke();
    ctx.fillStyle = P.cream;
    ctx.beginPath(); ctx.arc(2.60 * u, -5.70 * u, u * 0.30, 0, TAU); ctx.fill();
    ctx.strokeStyle = O; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();
  } else {
    ctx.strokeStyle = P.yellow;
    ctx.lineWidth = u * 0.52;
    ctx.beginPath();
    ctx.moveTo(-0.10 * u, -5.60 * u);
    ctx.quadraticCurveTo(0.70 * u, -5.30 * u, 1.15 * u, -4.75 * u);
    ctx.stroke();
    ctx.fillStyle = P.cream;
    ctx.beginPath(); ctx.arc(1.18 * u, -4.70 * u, u * 0.24, 0, TAU); ctx.fill();
    ctx.strokeStyle = O; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();
  }

  ctx.restore();   /* bird group */

  ctx.restore();
}

function drawNeckHead(u, LW) {
  const p0 = { x: 0,        y: 0 };
  const p1 = { x: 0.35 * u, y: -2.20 * u };
  const p2 = { x: 1.90 * u, y: -3.60 * u };
  const p3 = { x: 2.70 * u, y: -3.50 * u };

  const N = 16, pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N, m = 1 - s;
    pts.push({
      x: m*m*m*p0.x + 3*m*m*s*p1.x + 3*m*s*s*p2.x + s*s*s*p3.x,
      y: m*m*m*p0.y + 3*m*m*s*p1.y + 3*m*s*s*p2.y + s*s*s*p3.y
    });
  }

  const left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i];
    const q = pts[Math.min(i + 1, N)], r = pts[Math.max(i - 1, 0)];
    let tx = q.x - r.x, ty = q.y - r.y;
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = lerp(1.00 * u, 0.50 * u, i / N) / 2;
    left.push({ x: p.x - ty * w, y: p.y + tx * w });
    right.push({ x: p.x + ty * w, y: p.y - tx * w });
  }
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i <= N; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = N; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.fillStyle = P.cream; ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = LW; ctx.stroke();

  /* head */
  ctx.save();
  ctx.translate(3.50 * u, -3.50 * u);
  ctx.rotate(-0.10);

  // beak
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(0.78 * u, -0.20 * u);
  ctx.lineTo(2.02 * u, 0.10 * u);
  ctx.lineTo(0.78 * u, 0.36 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();

  // skull
  ctx.fillStyle = P.cream;
  ctx.beginPath(); ctx.ellipse(0, 0, 1.10 * u, 0.90 * u, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = LW; ctx.stroke();

  // cap dome
  ctx.fillStyle = P.yellow;
  ctx.beginPath();
  ctx.moveTo(-1.00 * u, -0.42 * u);
  ctx.quadraticCurveTo(-0.12 * u, -1.66 * u, 0.92 * u, -0.60 * u);
  ctx.quadraticCurveTo(-0.05 * u, -0.26 * u, -1.00 * u, -0.42 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.065); ctx.stroke();

  // cap brim
  ctx.fillStyle = P.yellowSh;
  ctx.beginPath();
  ctx.moveTo(0.56 * u, -0.74 * u);
  ctx.quadraticCurveTo(1.58 * u, -0.62 * u, 1.74 * u, -0.12 * u);
  ctx.lineTo(1.42 * u, -0.14 * u);
  ctx.quadraticCurveTo(1.26 * u, -0.50 * u, 0.52 * u, -0.50 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();

  // eye
  ctx.fillStyle = P.white;
  ctx.beginPath(); ctx.arc(0.20 * u, -0.14 * u, 0.25 * u, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.05); ctx.stroke();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.arc(0.28 * u, -0.14 * u, 0.135 * u, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ================================================================== *
 *  game logic
 * ================================================================== */
function finalScore() { return Math.floor(runScroll / 40) + coinCount * 25 + bonus; }

function playerBox() {
  const u = R;
  const hp = (cq > 0.5 ? 5.6 : 9.7) * u;
  return { x0: riderX - 2.0 * u, x1: riderX + 2.0 * u, y0: jumpY, y1: jumpY + hp };
}
const rectHit = (pb, cx, hw, h) =>
  pb.x0 < cx + hw && pb.x1 > cx - hw && pb.y0 < h;
const bandHit = (pb, cx, hw, lo, hi) =>
  pb.x0 < cx + hw && pb.x1 > cx - hw && pb.y0 < hi && pb.y1 > lo;
const circHit = (pb, cx, cy, r) => {
  const nx = clamp(cx, pb.x0, pb.x1), ny = clamp(cy, pb.y0, pb.y1);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
};

function tryJump() {
  if (airborne || (mode !== 'playing' && mode !== 'title')) return;
  const k = R / 40;
  airborne = true; rampAir = false;
  jumpV = JUMPV * k; jumpY = 0.5;
  jumpPressAt = t;
  boxV -= 300 * k; neckV -= 2.6; sqV += 1.2;
  puff(riderX - 2.5 * R, groundY, 5, R * 0.5, 1);
}

function land(k) {
  airborne = false; rampAir = false;
  jumpY = 0; jumpV = 0;
  sqV   += 2.9;
  boxV  -= 560 * k;
  neckV += 4.2;
  tiltV += 1.7;
  shake  = 2.6 * k;
  puff(riderX - 2.5 * R, groundY, 9, R * 0.9, 1);
  puff(riderX + 2.6 * R, groundY, 7, R * 0.7, 1);
  if (mode === 'playing' && t - jumpPressAt < 0.12) tryJump();   // jump buffer
}

function floater(x, y, txt, col, size, align) {
  floaters.push({ x, y, txt, col, size, life: 0, max: 1.0, align: align || 'center' });
}

function die() {
  mode = 'dying'; dieT = 0; hearts = 0;
  shake = 10; redFlash = 0.8;
  burst(riderX, groundY - 5 * R, 26,
        ['#FBEFDD', '#E2CCB0', '#FFC93C', '#EE5C4D'], R * 1.6, { up: 1.2 });
  if (!airborne) { airborne = true; jumpY = 0.5; }
  jumpV = Math.max(jumpV, 620 * (R / 40));
  rampAir = false;
  boxV -= 700 * (R / 40);
}

function damage(x, cols, breakFn) {
  hearts--;
  shake = 7.5; redFlash = 0.55; dipT = 0.8;
  burst(x, groundY - 4 * R, 14, cols, R * 1.2);
  if (hearts <= 0) { die(); return; }
  inv = 1.6;
  if (breakFn) breakFn();
}

/* ---- spawning ---- */
function weightedPick(table) {
  let s = 0;
  for (const it of table) s += it[1];
  let r = Math.random() * s;
  for (const it of table) { r -= it[1]; if (r <= 0) return it[0]; }
  return table[0][0];
}

function coinArc(wx, topH, span) {
  const n = 4 + (Math.random() * 2 | 0);
  for (let i = 0; i < n; i++) {
    const s = n === 1 ? 0.5 : i / (n - 1);
    coinsA.push({
      wx: wx - span * R / 2 + span * R * s,
      h: 1.0 + Math.sin(Math.PI * s) * topH,
      phase: rand(0, 6), got: false
    });
  }
}

function spawnWave(wx, diff) {
  const u = R;
  const table = [
    ['cone', 2.6], ['bin', 2.2], ['barrier', 2.0], ['crates', 1.4],
    ['puddle', 1.8], ['lowbar', 1.6], ['pigeons', 1.1], ['bump', 1.8]
  ];
  let kind = weightedPick(table);
  if ((kind === 'lowbar' || kind === 'pigeons') && wx - lastWx < speed * 1.15) kind = 'cone';
  obstacles.push({ kind, wx, seed: Math.random() * 100, used: false });
  lastWx = wx;

  const arc = {
    bump: [4.6, 9], cone: [3.0, 6], bin: [3.4, 7],
    barrier: [4.0, 10], crates: [5.6, 11]
  }[kind];
  if (arc && Math.random() < 0.62) coinArc(wx, arc[0], arc[1]);

  // ground train in the gap behind the wave
  if (Math.random() < 0.30) {
    const n = 3 + (Math.random() * 3 | 0);
    const start = wx + speed * 0.55;
    for (let i = 0; i < n; i++) {
      coinsA.push({
        wx: start + i * 1.5 * u,
        h: Math.random() < 0.3 ? 2.7 : 1.6,
        phase: rand(0, 6), got: false
      });
    }
    if (hearts < 3 && Math.random() < 0.35) {
      coinsA.push({ wx: start - 1.6 * u, h: 1.8, phase: rand(0, 6), got: false, heart: true });
    }
  }

  // staggered pair at higher difficulty
  if (diff > 0.4 && (kind === 'cone' || kind === 'bin') && Math.random() < 0.3) {
    obstacles.push({ kind: 'cone', wx: wx + speed * 0.42, seed: Math.random() * 100, used: false });
    lastWx = wx + speed * 0.5;
  }
}

/* ---- title attract autopilot ---- */
function autopilot() {
  const u = R;
  const front = riderX + 2.0 * u;
  let wantCrouch = false;
  for (const o of obstacles) {
    const x = o.wx - scroll;
    if (o.kind === 'lowbar' || o.kind === 'pigeons') {
      const d = x - front;
      if (d < speed * 0.45 && d > -3.5 * u) wantCrouch = true;
    } else if (o.kind !== 'bump') {
      const d = x - front;
      if (d > 0 && d < speed * 0.42 + 2.0 * u && !airborne) {
        jumpKey = true;
        tryJump();
      }
    }
  }
  crouchKey = wantCrouch;
}

/* ---- per-frame world update ---- */
function updateObstacles(dt) {
  const u = R, k = u / 40;
  const active = mode === 'playing' || mode === 'title';
  const pb = playerBox();

  for (const o of obstacles) {
    if (o.kind === 'pigeons' && mode !== 'over') o.wx -= 170 * k * dt;
    const x = o.wx - scroll;

    // ramp launch
    if (o.kind === 'bump' && !o.used && active && !airborne && x < riderX + 2.6 * u) {
      o.used = true;
      airborne = true; rampAir = true;
      jumpV = JUMPV * 0.85 * k; jumpY = 0.5;
      boxV -= 300 * k; neckV -= 2.6;
    }

    if (active && !o.dead && inv <= 0 && mode === 'playing') {
      let hit = false;
      if (o.kind === 'cone')    hit = rectHit(pb, x, 0.70 * u, 1.35 * u);
      if (o.kind === 'bin')     hit = rectHit(pb, x, 1.05 * u, 2.50 * u);
      if (o.kind === 'barrier') hit = rectHit(pb, x, 2.10 * u, 2.05 * u);
      if (o.kind === 'crates')  hit = rectHit(pb, x, 1.35 * u, 4.30 * u);
      if (o.kind === 'lowbar' && !o.torn)
        hit = bandHit(pb, x, 2.7 * u, 6.9 * u, 9.5 * u);
      if (o.kind === 'pigeons') {
        for (let i = 0; i < 3; i++) {
          const p = pigeonPos(o, i, x, u);
          if (circHit(pb, p.x, groundY - p.y, 0.5 * u)) { hit = true; break; }
        }
      }
      if (hit) {
        const cols = {
          cone:    ['#FF8A3D', '#D9622B', '#FFFDF6'],
          bin:     ['#3E7C64', '#2C5A49', '#FBEFDD'],
          barrier: ['#FFC93C', '#0B1A22', '#EE5C4D'],
          crates:  ['#EFDDBC', '#FFC93C', '#FFFDF6'],
          lowbar:  ['#FBEFDD', '#EE5C4D'],
          pigeons: ['#AEB9C2', '#8B98A3', '#FBEFDD']
        }[o.kind] || ['#FBEFDD'];
        if (o.kind === 'lowbar') {
          damage(x, cols, () => { o.torn = true; });
        } else {
          damage(x, cols, () => { o.dead = true; });
        }
        if (mode !== 'playing') break;   // died mid-swing
      }
    }

    // puddle slip — no damage, just a scare
    if (active && o.kind === 'puddle' && !airborne && slipT <= 0 &&
        Math.abs(x - riderX) < 3.2 * u && jumpY < 0.3 * u) {
      slipT = 0.9; shake = 3.5;
      burst(x, groundY - 0.3 * u, 10, ['#9FC6D8', '#5E93A0', '#C3E0EA'], R * 1.1, { max: 0.5 });
    }
  }
  if (obstacles.length) obstacles = obstacles.filter(o => !o.dead && (o.wx - scroll) > -10 * u);
}

function updateCoins() {
  const u = R;
  const hp = (cq > 0.5 ? 5.6 : 9.7) * u;
  for (const c of coinsA) {
    if (c.got) continue;
    const x = c.wx - scroll;
    if (x < riderX - 2.9 * u || x > riderX + 2.9 * u) continue;
    const cy = c.h * u;
    if (cy < jumpY - 0.9 * u || cy > jumpY + hp + 0.9 * u) continue;
    c.got = true;
    const y = groundY - cy - 0.6 * u;
    if (c.heart) {
      if (hearts < 3) {
        hearts++;
        floater(x, y - 14, '♥ +1', '#FF7B70', 20);
        sparkle(x, y, ['#FF7B70', '#FFFDF6', '#FFC0B8']);
      } else {
        bonus += 50;
        floater(x, y - 14, '+50', '#FFD98A', 20);
        sparkle(x, y, ['#FFD98A', '#FFFDF6', '#FFC93C']);
      }
    } else {
      coinCount++;
      floater(x, y - 14, '+25', '#FFD98A', 17);
      sparkle(x, y, ['#FFD98A', '#FFFDF6', '#FFC93C']);
    }
  }
  if (coinsA.length) coinsA = coinsA.filter(c => !c.got && (c.wx - scroll) > -8 * u);
}

/* ================================================================== *
 *  update
 * ================================================================== */
function update(dt) {
  const k = R / 40;

  /* ---- pace & difficulty ---- */
  if (mode === 'playing') playT += dt;
  if (mode === 'dying')   dieT  += dt;
  const diff = mode === 'playing' ? clamp(playT / 95, 0, 1) : 0;
  const ramp = mode === 'playing' ? Math.min(300, playT * 4.2) : 0;

  let mul = 1;
  const groundSlow = airborne ? 1 : lerp(1, 0.84, cq);
  if (slipT > 0) { slipT -= dt; mul *= 0.55 + 0.45 * clamp(1 - slipT / 0.9, 0, 1); }
  if (dipT  > 0) { dipT  -= dt; mul *= 0.60 + 0.40 * clamp(1 - dipT / 0.8, 0, 1); }
  if (mode === 'dying') mul *= clamp(1 - dieT * 1.05, 0, 1);

  speed = (645 + ramp + 55 * Math.sin(t * 0.55)) * k * groundSlow * mul;
  if (mode !== 'over') scroll += speed * dt;
  if (mode === 'playing') runScroll += speed * dt;

  wheelAng += (speed / R) * dt * (mode === 'dying' ? 0.15 : 1);
  crankAng += (speed / R) * 0.52 * dt * (mode === 'dying' ? 0 : 1);

  /* ---- pose springs ---- */
  const cqT = (!airborne && crouchKey && (mode === 'playing' || mode === 'title')) ? 1 : 0;
  [cq, cqV] = spring(cq, cqV, 260, 20, dt, cqT);

  let neckT = cq * 0.62;
  if (mode === 'dying') neckT += Math.min(dieT * 2.5, 1.5);
  [neckA, neckV] = spring(neckA, neckV, 90, 7.5, dt, neckT);
  [boxA,  boxV ] = spring(boxA,  boxV, 120, 10,  dt, 0);
  [sqA,   sqV  ] = spring(sqA,   sqV, 420, 24,  dt, 0);

  const moveDir = (rightKey ? 1 : 0) - (leftKey ? 1 : 0);
  let tiltTarget = airborne ? clamp(-jumpV * 0.00020, -0.10, 0.10) : 0;
  tiltTarget += moveDir * 0.065;
  if (slipT > 0) tiltTarget += Math.sin(t * 26) * 0.09 * clamp(slipT / 0.9, 0, 1);
  [tiltA, tiltV] = spring(tiltA, tiltV, 170, 12, dt, tiltTarget);

  if (inv > 0) inv -= dt;
  if (redFlash > 0) redFlash -= dt * 1.6;

  boxTimer -= dt;
  if (boxTimer <= 0) { boxTimer = rand(2.4, 4.4); boxV -= 300 * k; }

  /* ---- vertical physics ---- */
  if (mode === 'dying') {
    jumpV -= G * k * dt;
    jumpY += jumpV * dt;
    tiltA += 6.2 * dt;                       // tumble
    if (jumpY <= 0) { jumpY = 0; jumpV = 0; }
    if (dieT > 1.15) {
      mode = 'over'; overAt = t;
      newBest = finalScore() > best && best > 0 || (best === 0 && finalScore() > 0);
      best = Math.max(best, finalScore());
    }
  } else if (airborne) {
    let gm = 1;
    if (crouchKey) gm = 2.2;                             // fast-fall
    else if (jumpV > 0) gm = (jumpKey || rampAir) ? 0.52 : 1.55;   // hold = higher
    jumpV -= G * k * gm * dt;
    jumpY += jumpV * dt;
    if (jumpY <= 0 && jumpV < 0) land(k);
  }

  /* ---- steering ---- */
  if (mode === 'playing' || mode === 'title') {
    riderX = clamp(riderX + moveDir * 480 * k * dt, W * 0.12, W * 0.58);
  }

  /* ---- spawning ---- */
  if (mode === 'playing' || mode === 'title') {
    if (!spawnInit) { nextAt = scroll + W * 1.4; lastWx = scroll - speed * 2; spawnInit = true; }
    let guard = 0;
    while (nextAt - scroll < W + 420 && guard++ < 8) {
      spawnWave(nextAt, diff);
      nextAt += Math.max(speed * rand(0.95, 1.7) * (1.32 - 0.5 * diff), speed * 0.9);
    }
  }

  if (mode === 'title') autopilot();

  updateObstacles(dt);
  updateCoins();

  /* ---- milestones ---- */
  if (mode === 'playing') {
    const m = Math.floor(runScroll / 40);
    if (m >= lastMile + 500) {
      lastMile += 500;
      floater(W / 2, H * 0.30, lastMile + 'm！', '#FFD98A', 32);
      floaters[floaters.length - 1].max = 1.4;
    }
  }

  /* ---- particles ---- */
  if (!airborne && mode !== 'over') {
    dustTimer -= dt;
    if (dustTimer <= 0) {
      dustTimer = 0.055;
      puff(riderX - 2.5 * R, groundY, 1, R * 0.22, 0.5);
    }
  }

  for (const d of dust) {
    d.life += dt;
    d.x += (d.vx - speed * 0.92) * dt;
    d.y += d.vy * dt;
    d.vy += 210 * dt;
    d.vx *= 0.985;
  }
  if (dust.length) dust = dust.filter(d => d.life < d.max);
  if (dust.length > 260) dust.splice(0, dust.length - 260);

  for (const d of debris) {
    d.life += dt;
    d.x += (d.vx - speed * 0.95) * dt;
    d.y += d.vy * dt;
    d.vy += 1500 * k * d.g * dt;
    d.rot += d.rv * dt;
  }
  if (debris.length) debris = debris.filter(d => d.life < d.max && d.y < H + 60);

  for (const f of floaters) {
    f.life += dt;
    f.y -= (f.size >= 24 ? 20 : 46) * dt;
  }
  if (floaters.length) floaters = floaters.filter(f => f.life < f.max);

  shake *= Math.pow(0.02, dt);
}

/* ================================================================== *
 *  HUD & overlays
 * ================================================================== */
function drawHUD() {
  const u = R;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  // hearts
  for (let i = 0; i < 3; i++) {
    const hx = 30 + i * 40, hy = 30;
    heartPath(hx, hy, 13);
    if (i < hearts) {
      ctx.fillStyle = '#FF5A4E'; ctx.fill();
      ctx.strokeStyle = 'rgba(11,26,34,.75)'; ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(11,26,34,.35)'; ctx.fill();
      ctx.strokeStyle = 'rgba(251,239,221,.55)'; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  // coin counter
  ctx.fillStyle = P.yellow;
  ctx.beginPath(); ctx.arc(30, 66, 9, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.yellowDk; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = P.white;
  ctx.beginPath();
  ctx.moveTo(32.2, 60.5); ctx.lineTo(28.2, 66.2); ctx.lineTo(30.2, 66.2);
  ctx.lineTo(28.6, 71.5); ctx.lineTo(32.8, 65.4); ctx.lineTo(30.6, 65.4);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 17px "Menlo",monospace';
  ctx.fillStyle = P.cream;
  ctx.shadowColor = 'rgba(11,26,34,.6)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
  ctx.fillText('× ' + coinCount, 46, 67);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // score block, right
  ctx.textAlign = 'right';
  ctx.font = 'bold 30px "DIN Alternate","Menlo",monospace';
  ctx.fillStyle = P.cream;
  ctx.shadowColor = 'rgba(11,26,34,.6)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2;
  ctx.fillText(String(finalScore()), W - 22, 40);
  ctx.font = 'bold 13px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(255,217,138,.95)';
  ctx.fillText('最高 ' + best, W - 22, 68);
  ctx.fillStyle = 'rgba(251,239,221,.75)';
  ctx.fillText(Math.floor(runScroll / 40) + ' m', W - 22, 90);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}

function keyLine(x, y, keys, desc) {
  ctx.textAlign = 'left';
  ctx.font = 'bold 16px "Menlo",monospace';
  ctx.fillStyle = '#FFC93C';
  ctx.shadowColor = 'rgba(11,26,34,.6)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
  ctx.fillText(keys, x, y);
  const kw = ctx.measureText(keys).width;
  ctx.font = '15px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(251,239,221,.92)';
  ctx.fillText(desc, x + kw + 14, y + 1);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
}

function drawTitle() {
  ctx.fillStyle = 'rgba(15,27,46,.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = W / 2;

  ctx.font = 'bold ' + clamp(W * 0.085, 44, 72) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(11,26,34,.65)';
  ctx.fillText('鸵鸟外卖', cx + 4, H * 0.26 + 4);
  ctx.fillStyle = P.cream;
  ctx.fillText('鸵鸟外卖', cx, H * 0.26);
  ctx.font = 'bold 17px "PingFang SC",sans-serif';
  ctx.fillStyle = P.yellow;
  ctx.fillText('黄昏公路 · 极速配送', cx, H * 0.26 + 52);

  const lx = cx - 148;
  let y = H * 0.26 + 118;
  keyLine(lx, y,        '← → / A D',   '前后移动');
  keyLine(lx, y += 36,  '↑ / W / 空格', '跳跃（按住跳得更高）');
  keyLine(lx, y += 36,  '↓ / S',        '下蹲 · 空中速降');
  keyLine(lx, y += 36,  'P / R',        '暂停 · 重开');

  ctx.textAlign = 'center';
  ctx.font = '14px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(251,239,221,.68)';
  ctx.fillText('躲开路障，收好小费，别把外卖摔了。', cx, y + 52);

  const a = 0.55 + Math.sin(t * 3.2) * 0.4;
  ctx.globalAlpha = a;
  ctx.font = 'bold 19px "PingFang SC",sans-serif';
  ctx.fillStyle = '#FFC93C';
  ctx.fillText('点击 / 空格 开始', cx, H * 0.78);
  ctx.globalAlpha = 1;

  if (best > 0) {
    ctx.font = 'bold 14px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,217,138,.9)';
    ctx.fillText('本次最高 ' + best, cx, H * 0.78 + 38);
  }
}

function drawOver() {
  ctx.fillStyle = 'rgba(15,27,46,.68)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = W / 2;

  ctx.save();
  ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.shadowColor = 'rgba(238,92,77,.9)';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#FFE9E4';
  ctx.fillText('外卖翻车啦！', cx, H * 0.26);
  ctx.restore();

  ctx.font = 'bold 54px "DIN Alternate","Menlo",monospace';
  ctx.fillStyle = P.cream;
  ctx.shadowColor = 'rgba(255,201,60,.55)'; ctx.shadowBlur = 14;
  ctx.fillText(String(finalScore()), cx, H * 0.42);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  ctx.font = 'bold 13px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(251,239,221,.8)';
  ctx.fillText('最终得分', cx, H * 0.42 + 36);

  const m = Math.floor(runScroll / 40);
  let line = '里程 ' + m + ' m · 小费 × ' + coinCount;
  if (bonus > 0) line += ' · 奖励 +' + bonus;
  ctx.font = '15px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(251,239,221,.85)';
  ctx.fillText(line, cx, H * 0.42 + 76);

  ctx.font = 'bold 16px "PingFang SC",sans-serif';
  if (newBest) {
    ctx.fillStyle = '#FFC93C';
    ctx.fillText('新纪录！', cx, H * 0.42 + 114);
  } else {
    ctx.fillStyle = 'rgba(255,217,138,.95)';
    ctx.fillText('本次最高 ' + best, cx, H * 0.42 + 114);
  }

  const a = 0.5 + Math.sin(t * 3.2) * 0.45;
  ctx.globalAlpha = a;
  ctx.font = 'bold 18px "PingFang SC",sans-serif';
  ctx.fillStyle = '#FFC93C';
  ctx.fillText('点击 / 空格 再来一局', cx, H * 0.76);
  ctx.globalAlpha = 1;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(15,27,46,.66)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = P.cream;
  ctx.fillText('已 暂 停', W / 2, H / 2 - 18);
  ctx.font = '15px "PingFang SC",sans-serif';
  ctx.fillStyle = 'rgba(251,239,221,.85)';
  ctx.fillText('按 P 或点击继续', W / 2, H / 2 + 32);
}

function drawRedFlash() {
  const a = clamp(redFlash, 0, 0.8) * 0.5;
  if (a <= 0.01) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(238,60,45,0)');
  g.addColorStop(1, 'rgba(238,60,45,' + a.toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---- touch buttons ---- */
function touchBtns() {
  const r = clamp(H * 0.055, 34, 52);
  const y = H - r - 26;
  return [
    { k: 'left',   x: r + 28,           y, r },
    { k: 'right',  x: r * 3 + 56,       y, r },
    { k: 'crouch', x: W - r * 3 - 56,   y, r },
    { k: 'jump',   x: W - r - 28,       y, r: r + 4 }
  ];
}

function drawTouchUI() {
  const btns = touchBtns();
  for (const b of btns) {
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = P.cream;
    ctx.lineWidth = 2.5;
    ctx.fillStyle = 'rgba(251,239,221,.10)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = P.cream;
    ctx.beginPath();
    const s = b.r * 0.42;
    if (b.k === 'left') {
      ctx.moveTo(b.x + s * 0.5, b.y - s); ctx.lineTo(b.x - s * 0.7, b.y); ctx.lineTo(b.x + s * 0.5, b.y + s);
    } else if (b.k === 'right') {
      ctx.moveTo(b.x - s * 0.5, b.y - s); ctx.lineTo(b.x + s * 0.7, b.y); ctx.lineTo(b.x - s * 0.5, b.y + s);
    } else if (b.k === 'jump') {
      ctx.moveTo(b.x, b.y - s); ctx.lineTo(b.x + s * 0.8, b.y + s * 0.5); ctx.lineTo(b.x - s * 0.8, b.y + s * 0.5);
    } else {
      ctx.moveTo(b.x, b.y + s); ctx.lineTo(b.x + s * 0.8, b.y - s * 0.5); ctx.lineTo(b.x - s * 0.8, b.y - s * 0.5);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ================================================================== *
 *  render
 * ================================================================== */
let seeking = false;

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const sh = shake > 0.25 ? shake : 0;
  ctx.save();
  if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));

  drawSky();
  drawFar();
  drawMid();
  drawGround();
  drawTrees();
  drawLamps();
  drawRoad();
  drawObstacles();
  drawCoins();
  drawAirStreaks();
  drawDust();
  drawShadow();
  drawRig();
  drawDebris();
  drawForeground();
  drawFloaters();

  ctx.restore();

  if (!seeking) {
    drawRedFlash();
    if (mode === 'playing' || mode === 'dying') drawHUD();
    if (TOUCH && mode === 'playing') drawTouchUI();
    if (mode === 'title')  drawTitle();
    if (mode === 'over')   drawOver();
    if (mode === 'paused') drawPaused();
  }
}

/* ================================================================== *
 *  state transitions
 * ================================================================== */
function resetRun() {
  runScroll = 0; playT = 0; coinCount = 0; bonus = 0; hearts = 3;
  inv = 0; dipT = 0; slipT = 0; redFlash = 0; dieT = 0;
  obstacles = []; coinsA = []; debris = []; floaters = [];
  nextAt = scroll + W * 1.6; lastWx = scroll; spawnInit = true;
  riderX = W * 0.330;
  jumpY = 0; jumpV = 0; airborne = false; rampAir = false;
  cq = cqV = 0;
  neckA = neckV = boxA = boxV = sqA = sqV = tiltA = tiltV = 0;
  leftKey = rightKey = jumpKey = crouchKey = false;
  lastMile = 0; newBest = false;
}
function startGame() { resetRun(); mode = 'playing'; }
function togglePause() {
  if (mode === 'playing') mode = 'paused';
  else if (mode === 'paused') { mode = 'playing'; last = 0; }
}

/* ================================================================== *
 *  input
 * ================================================================== */
function applyBtn(k, down) {
  if (k === 'left')  leftKey = down;
  if (k === 'right') rightKey = down;
  if (k === 'crouch') crouchKey = down;
  if (k === 'jump') {
    jumpKey = down;
    if (down) { jumpPressAt = t; tryJump(); }
  }
}
function hitBtn(px, py) {
  for (const b of touchBtns()) {
    const dx = px - b.x, dy = py - b.y;
    if (dx * dx + dy * dy < (b.r * 1.18) * (b.r * 1.18)) return b.k;
  }
  return null;
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (mode === 'title') { startGame(); return; }
  if (mode === 'over')  { if (t - overAt > 0.4) startGame(); return; }
  if (mode === 'paused'){ togglePause(); return; }
  if (!TOUCH || mode !== 'playing') return;
  const k = hitBtn(e.clientX, e.clientY);
  if (k) { ptrMap.set(e.pointerId, k); applyBtn(k, true); }
});
const releasePtr = e => {
  const k = ptrMap.get(e.pointerId);
  if (k) { ptrMap.delete(e.pointerId); applyBtn(k, false); }
};
cv.addEventListener('pointerup', releasePtr);
cv.addEventListener('pointercancel', releasePtr);
cv.addEventListener('pointerleave', releasePtr);

window.addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (mode === 'title' && ['Space', 'Enter', 'ArrowUp', 'KeyW'].includes(c)) { startGame(); return; }
  if (mode === 'over' && ['Space', 'Enter', 'KeyR'].includes(c)) {
    if (t - overAt > 0.4) startGame();
    return;
  }
  if (c === 'KeyP' && (mode === 'playing' || mode === 'paused')) { togglePause(); return; }
  if (c === 'Escape' && (mode === 'playing' || mode === 'paused')) { togglePause(); return; }
  if (c === 'KeyR' && (mode === 'playing' || mode === 'over' || mode === 'paused')) { startGame(); return; }
  if (mode !== 'playing') {
    // still track keys on title so autopilot keys don't stick into play
    if (c === 'ArrowLeft' || c === 'KeyA') leftKey = true;
    if (c === 'ArrowRight' || c === 'KeyD') rightKey = true;
    if (c === 'ArrowDown' || c === 'KeyS') crouchKey = true;
    return;
  }
  switch (c) {
    case 'ArrowLeft': case 'KeyA': leftKey = true; break;
    case 'ArrowRight': case 'KeyD': rightKey = true; break;
    case 'ArrowUp': case 'KeyW': case 'Space':
      if (!e.repeat) { jumpKey = true; jumpPressAt = t; tryJump(); }
      break;
    case 'ArrowDown': case 'KeyS': crouchKey = true; break;
  }
});
window.addEventListener('keyup', e => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': leftKey = false; break;
    case 'ArrowRight': case 'KeyD': rightKey = false; break;
    case 'ArrowUp': case 'KeyW': case 'Space': jumpKey = false; break;
    case 'ArrowDown': case 'KeyS': crouchKey = false; break;
  }
});
window.addEventListener('blur', () => {
  leftKey = rightKey = jumpKey = crouchKey = false;
  ptrMap.clear();
  if (mode === 'playing') mode = 'paused';
});

/* ================================================================== *
 *  loop
 * ================================================================== */
let last = 0, paused = false;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (paused) return;
  if (mode === 'paused') { render(); return; }
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;
  t += dt;
  update(dt);
  render();
}

window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => {
  last = 0;
  if (document.hidden && mode === 'playing') mode = 'paused';
});

layout();
requestAnimationFrame(frame);

/* ?t=2.6 or #t=2.6 renders a single frozen frame — handy for stills / review.
   &p=1 starts a real run before simulating, so stills show gameplay state. */
const mHash = /(?:^|[#&?])t=([\d.]+)/.exec(location.search + location.hash);
const mPlay = /(?:^|[#&?])p=(\d)/.exec(location.search + location.hash);
if (mHash) {
  setTimeout(() => window.__scene.seek(parseFloat(mHash[1]), !!(mPlay && mPlay[1] === '1')), 0);
}

/* expose a debug hook so the scene can be probed / frozen for review */
window.__scene = {
  get state() {
    return {
      W, H, R, riderX, groundY, roadTop, roadBottom, horizonY, t,
      mode, hearts, score: finalScore(), coins: coinCount, best,
      airborne, jumpY, wheelAng, crankAng, neckA, boxA, sqA, tiltA, cq, inv,
      obstacles: obstacles.length, coinsA: coinsA.length, scroll
    };
  },
  seek(tSec, play) {
    paused = false; seeking = true;
    scroll = 0; wheelAng = 0; crankAng = 0;
    jumpY = 0; jumpV = 0; airborne = false; rampAir = false;
    neckA = neckV = boxA = boxV = sqA = sqV = tiltA = tiltV = cq = cqV = 0;
    shake = 0; boxTimer = 2.4;
    obstacles = []; coinsA = []; debris = []; floaters = []; dust = []; dustTimer = 0;
    runScroll = 0; playT = 0; coinCount = 0; bonus = 0; hearts = 3;
    inv = 0; dipT = 0; slipT = 0; redFlash = 0; dieT = 0; lastMile = 0;
    spawnInit = false; mode = 'title';
    leftKey = rightKey = jumpKey = crouchKey = false;
    t = 0;
    if (play) startGame();
    const h = 1 / 120;
    let guard = 0;
    while (t < tSec - 1e-9 && guard++ < 100000) {
      const dt = Math.min(h, tSec - t);
      t += dt;
      update(dt);
    }
    render();
    seeking = false;
    paused = true;
  },
  /* advance the live simulation synchronously (test/automation hook) */
  step(sec) {
    paused = false; seeking = true;
    const h = 1 / 120;
    let guard = 0;
    const end = t + sec;
    while (t < end - 1e-9 && guard++ < 200000) {
      const dt = Math.min(h, end - t);
      t += dt;
      update(dt);
    }
    render();
    seeking = false;
    paused = true;
  },
  snap(ui) {
    seeking = !ui;
    render();
    seeking = false;
  },
  trace(tSec, step) {
    paused = false; seeking = true;
    scroll = 0; wheelAng = 0; crankAng = 0;
    jumpY = 0; jumpV = 0; airborne = false; rampAir = false;
    neckA = neckV = boxA = boxV = sqA = sqV = tiltA = tiltV = cq = cqV = 0;
    shake = 0; boxTimer = 2.4;
    obstacles = []; coinsA = []; debris = []; floaters = []; dust = []; dustTimer = 0;
    runScroll = 0; playT = 0; coinCount = 0; bonus = 0; hearts = 3;
    inv = 0; dipT = 0; slipT = 0; redFlash = 0; dieT = 0; lastMile = 0;
    spawnInit = false; mode = 'title';
    leftKey = rightKey = jumpKey = crouchKey = false;
    t = 0;
    const h = step || 1 / 120, ev = [];
    let prevAir = false, guard = 0;
    while (t < tSec - 1e-9 && guard++ < 400000) {
      const dt = Math.min(h, tSec - t);
      t += dt; update(dt);
      if (airborne && !prevAir) ev.push(+t.toFixed(2));
      prevAir = airborne;
    }
    render(); seeking = false; paused = true;
    return ev;
  },
  resume() { paused = false; last = 0; },
  start() { startGame(); paused = false; last = 0; },
  /* test hooks: force the damage path / drop a specific obstacle ahead */
  hurt() { if (mode === 'playing') damage(riderX, ['#FBEFDD']); },
  spawn(kind, dx) {
    if (mode !== 'playing' && mode !== 'title') return null;
    const o = { kind, wx: scroll + W * 0.5 + (dx || 0), seed: 42, used: false };
    obstacles.push(o);
    lastWx = Math.max(lastWx, o.wx);
    nextAt = Math.max(nextAt, o.wx + W * 2.2);   /* keep random waves clear of the test zone */
    return o;
  }
};

})();
</script>
