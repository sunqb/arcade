<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鸵鸟外卖 · 极速配送</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b2e52;}
  canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
'use strict';

const cv  = document.getElementById('scene');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* ================================================================== *
 *  utils
 * ================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const hash  = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function rr(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function spring(p, v, k, c, dt, target) {
  target = target || 0;
  const sub = 2, h = dt / sub;
  for (let i = 0; i < sub; i++) {
    v += (-k * (p - target) - c * v) * h;
    p += v * h;
  }
  return [p, v];
}

/* ================================================================== *
 *  palette — luminous dusk sky, dark silhouettes, bright hero
 * ================================================================== */
const P = {
  /* sky */
  sky0:'#1A2C52', sky1:'#2F5F80', sky2:'#5E93A0', sky3:'#C3A87E', sky4:'#E8935A', sky5:'#FFC86E',
  sun:'#FFE9B0', sunCore:'#FFF7E0',
  cloud:'rgba(255,246,224,.18)',

  /* distant silhouettes (light → dark with depth) */
  far:'#2C4A5E',
  mid:'#1D3140', mid2:'#233B4C',
  win:'#FFC46B', winOff:'rgba(10,22,30,.50)',

  /* ground */
  side:'#37505E', sideTop:'#46626F',
  road:'#263A44', roadDark:'#16242C',
  dash:'#FFD98A',

  /* near silhouettes */
  tree:'#0E1F29', tree2:'#1A3340', trunk:'#0B1A22',
  lamp:'#101F29', glow:'#FFE9B0',

  /* hero */
  cream:'#FBEFDD', creamSh:'#E2CCB0',
  skin:'#E8A860', skinSh:'#B8804A',
  yellow:'#FFC93C', yellowSh:'#E3A61F', yellowDk:'#9E6F14',
  red:'#EE5C4D', redSh:'#B33E33',
  tire:'#0E1A21', rim:'#FBEFDD',
  beak:'#F08A2E', ink:'#0B1A22', white:'#FFFDF6'
};

/* ================================================================== *
 *  layout / state
 * ================================================================== */
let W = 0, H = 0, DPR = 1;
let horizonY = 0, roadTop = 0, groundY = 0, roadBottom = 0, R = 26, riderX = 0;

let t = 0, scroll = 0, wheelAng = 0, crankAng = 0, speed = 600;

let jumpY = 0, jumpV = 0, airborne = false;
let neckA = 0, neckV = 0;
let boxA  = 0, boxV  = 0;
let sqA   = 0, sqV   = 0;
let tiltA = 0, tiltV = 0;
let shake = 0, boxTimer = 2.4;

let bumps = [], nextBumpAt = 0, bumpInit = false;
let dust = [], dustTimer = 0;

const G = 2400, JUMPV = 760;

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth);
  H = Math.max(240, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';

  horizonY   = H * 0.585;
  roadTop    = H * 0.700;
  groundY    = H * 0.775;
  roadBottom = H * 0.925;
  R = clamp(Math.min(H * 0.050, W * 0.029), 12, 48);
  riderX = W * 0.330;
}

/* ================================================================== *
 *  parallax tile helper
 * ================================================================== */
function layer(period, factor, fn) {
  const p    = scroll * factor;
  const off  = p % period;
  const base = Math.floor(p / period);
  const n    = Math.ceil(W / period) + 2;
  for (let i = 0; i < n; i++) {
    const idx = base + i - 1;
    fn((i - 1) * period - off, idx);   // == idx*period - p
  }
}

/* ================================================================== *
 *  background
 * ================================================================== */
function drawSky() {
  const g = ctx.createLinearGradient(0, -8, 0, horizonY + 6);
  g.addColorStop(0.00, P.sky0);
  g.addColorStop(0.34, P.sky1);
  g.addColorStop(0.58, P.sky2);
  g.addColorStop(0.78, P.sky3);
  g.addColorStop(0.91, P.sky4);
  g.addColorStop(1.00, P.sky5);
  ctx.fillStyle = g;
  ctx.fillRect(-10, -10, W + 20, horizonY + 8);

  // sun
  const sx = W * 0.715, sy = horizonY - H * 0.155, sr = H * 0.072;
  const halo = ctx.createRadialGradient(sx, sy, sr * 0.7, sx, sy, sr * 3.6);
  halo.addColorStop(0, 'rgba(255,226,160,.34)');
  halo.addColorStop(1, 'rgba(255,226,160,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 3.6, 0, TAU); ctx.fill();
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  ctx.fillStyle = P.sunCore;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 0.62, 0, TAU); ctx.fill();

  // flat clouds
  ctx.fillStyle = P.cloud;
  layer(1500, 0.012, (x, idx) => {
    const y = horizonY * (0.10 + 0.42 * hash(idx * 9.1));
    const w = 130 + 200 * hash(idx * 4.3);
    const h = 10 + 10 * hash(idx * 6.7);
    rr(x, y, w, h, h / 2); ctx.fill();
    rr(x + w * 0.24, y - h * 0.68, w * 0.46, h * 0.95, h * 0.45); ctx.fill();
  });

  // distant birds
  ctx.strokeStyle = 'rgba(20,36,52,.42)';
  ctx.lineWidth = Math.max(1.4, H * 0.0022);
  ctx.lineCap = 'round';
  layer(900, 0.03, (x, idx) => {
    if (hash(idx * 8.3) < 0.45) return;
    const y = horizonY * (0.10 + 0.34 * hash(idx * 2.9));
    const s = H * (0.008 + 0.007 * hash(idx * 5.5));
    for (let i = 0; i < 3; i++) {
      const bx = x + i * s * 3.4, by = y + Math.sin(i * 1.9) * s * 1.6;
      ctx.beginPath();
      ctx.moveTo(bx - s, by + s * 0.55);
      ctx.quadraticCurveTo(bx, by - s * 0.35, bx + s, by + s * 0.55);
      ctx.stroke();
    }
  });
}

function drawFar() {
  ctx.fillStyle = P.far;
  layer(720, 0.05, (x, idx) => {
    const h = H * (0.06 + 0.15 * hash(idx * 1.7));
    const w = 720 * (0.42 + 0.42 * hash(idx * 3.1));
    ctx.fillRect(x, horizonY - h, w, h + 4);
    if (hash(idx * 5.3) > 0.58) {
      ctx.fillRect(x + w * 0.5 - 1.5, horizonY - h - H * 0.05, 3, H * 0.05);
    }
  });
}

function drawMid() {
  const sunX = W * 0.715;
  layer(520, 0.15, (x, idx) => {
    const w = 520 * (0.50 + 0.38 * hash(idx * 4.7));
    // keep the skyline low around the sun so the disc stays readable
    const dk = clamp(Math.abs(x + w / 2 - sunX) / (W * 0.21), 0, 1);
    const h = H * (0.09 + 0.15 * hash(idx * 2.3)) * (0.42 + 0.58 * dk);
    ctx.fillStyle = hash(idx * 6.1) > 0.5 ? P.mid : P.mid2;
    ctx.fillRect(x, horizonY - h, w, h + 4);

    ctx.fillStyle = 'rgba(6,16,24,.5)';
    ctx.fillRect(x, horizonY - h, w, 5);

    // irregular window grid: per-building pitch, jittered, three lit tones
    const gw = 9 + 5 * hash(idx * 7.9), gh = 12 + 6 * hash(idx * 5.7);
    const gx = 9 + 5 * hash(idx * 3.3), gy = 11 + 6 * hash(idx * 9.1);
    const cols = clamp(Math.floor((w - 22) / (gw + gx)), 1, 10);
    const rows = clamp(Math.floor((h - 22) / (gh + gy)), 1, 12);
    const ox = x + (w - (cols * gw + (cols - 1) * gx)) / 2;
    const oy = horizonY - h + 12;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const v = hash(idx * 13.7 + r * 7.13 + c * 3.31);
        if (v < 0.26) continue;                       // some windows dark
        ctx.fillStyle = v > 0.72 ? P.win : (v > 0.52 ? '#E8A44E' : P.winOff);
        ctx.fillRect(ox + c * (gw + gx), oy + r * (gh + gy), gw, gh);
      }
    }
  });
}

function drawGround() {
  // sidewalk band
  ctx.fillStyle = P.side;
  ctx.fillRect(-10, horizonY, W + 20, roadTop - horizonY + 2);
  ctx.fillStyle = P.sideTop;
  ctx.fillRect(-10, horizonY, W + 20, 5);

  // paving ticks
  ctx.fillStyle = 'rgba(8,20,28,.30)';
  layer(150, 0.72, (x) => { ctx.fillRect(x, horizonY + 8, 3, roadTop - horizonY - 10); });

  // curb
  ctx.fillStyle = '#0F1E28';
  ctx.fillRect(-10, roadTop - 8, W + 20, 8);
  ctx.fillStyle = 'rgba(255,217,138,.30)';
  ctx.fillRect(-10, roadTop - 8, W + 20, 2.5);
}

function drawTrees() {
  layer(330, 0.55, (x, idx) => {
    const s = 0.80 + 0.45 * hash(idx * 1.31);
    const th = H * 0.275 * s;
    const tw = Math.max(3, th * 0.048);
    const baseY = roadTop + 3;

    ctx.fillStyle = P.trunk;
    ctx.beginPath();
    ctx.moveTo(x - tw, baseY);
    ctx.lineTo(x + tw, baseY);
    ctx.lineTo(x + tw * 0.55, baseY - th * 0.58);
    ctx.lineTo(x - tw * 0.55, baseY - th * 0.58);
    ctx.closePath(); ctx.fill();

    const cy = baseY - th * 0.74;
    if (hash(idx * 2.77) > 0.28) {
      const r = th * 0.30;
      ctx.fillStyle = P.tree;
      ctx.beginPath();
      ctx.arc(x - r * 0.84, cy + r * 0.26, r, 0, TAU);
      ctx.arc(x + r * 0.84, cy + r * 0.26, r, 0, TAU);
      ctx.arc(x,            cy - r * 0.62, r * 1.10, 0, TAU);
      ctx.fill();
      ctx.fillStyle = P.tree2;
      ctx.beginPath(); ctx.arc(x - r * 0.18, cy - r * 0.86, r * 0.58, 0, TAU); ctx.fill();
    } else {
      // layered conifer, not a bare triangle
      ctx.fillStyle = P.tree;
      for (let i = 0; i < 3; i++) {
        const k = i * 0.16;
        const hw = th * (0.26 - k * 0.06), hy = cy - th * (0.50 - k * 0.22);
        ctx.beginPath();
        ctx.moveTo(x, hy - th * 0.10);
        ctx.quadraticCurveTo(x + hw * 0.7, hy + th * 0.14, x + hw, hy + th * 0.26);
        ctx.lineTo(x - hw, hy + th * 0.26);
        ctx.quadraticCurveTo(x - hw * 0.7, hy + th * 0.14, x, hy - th * 0.10);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = P.tree2;
      ctx.beginPath();
      ctx.moveTo(x, cy - th * 0.60);
      ctx.quadraticCurveTo(x + th * 0.09, cy - th * 0.34, x + th * 0.13, cy - th * 0.24);
      ctx.lineTo(x, cy - th * 0.24);
      ctx.closePath(); ctx.fill();
    }
  });
}

function drawLamps() {
  layer(330, 0.55, (x, idx) => {
    const px = x + 165;
    const s  = 0.92 + 0.16 * hash(idx * 3.9);
    const h  = H * 0.30 * s;
    const topY = roadTop + 3 - h;

    ctx.fillStyle = P.lamp;
    ctx.fillRect(px - 3 * s, topY, 6 * s, h);
    // arm
    ctx.beginPath();
    ctx.moveTo(px - 3 * s, topY);
    ctx.quadraticCurveTo(px + 20 * s, topY - 5 * s, px + 33 * s, topY + 7 * s);
    ctx.lineTo(px + 33 * s, topY + 11 * s);
    ctx.quadraticCurveTo(px + 17 * s, topY + 2 * s, px + 3 * s, topY + 4 * s);
    ctx.closePath(); ctx.fill();
    // lamp head: lit, fixed size so all lamps match
    ctx.fillStyle = P.glow;
    rr(px + 26 * s, topY + 5 * s, 17, 8, 4); ctx.fill();
    ctx.fillStyle = P.lamp;
    rr(px + 26 * s, topY + 12 * s, 17, 3.5, 1.5); ctx.fill();

    ctx.fillStyle = P.glow; ctx.globalAlpha = 0.34;
    ctx.beginPath(); ctx.arc(px + 34 * s, topY + 11 * s, 14 * s, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawRoad() {
  ctx.fillStyle = P.road;
  ctx.fillRect(-10, roadTop, W + 20, roadBottom - roadTop + 2);

  // far lane dashes
  ctx.fillStyle = P.dash; ctx.globalAlpha = 0.34;
  layer(155, 0.78, (x) => { rr(x, groundY + 32, 78, 5, 2.5); ctx.fill(); });

  // near lane dashes
  ctx.globalAlpha = 0.80;
  layer(190, 1.0, (x) => { rr(x, roadBottom - 32, 76, 8, 4); ctx.fill(); });
  ctx.globalAlpha = 1;

  ctx.fillStyle = P.roadDark;
  ctx.fillRect(-10, roadBottom, W + 20, H - roadBottom + 14);
}

/* ================================================================== *
 *  speed bump
 * ================================================================== */
function drawBumps() {
  const w = R * 3.2, h = R * 0.58;
  for (const b of bumps) {
    const x = b.worldX - scroll;
    if (x < -w * 2 || x > W + w * 2) continue;

    const y0 = groundY - h * 0.5, y1 = groundY + h * 1.05;
    const x0 = x - w / 2, x1 = x + w / 2;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0, y1);
    ctx.lineTo(x0 + w * 0.16, y0);
    ctx.lineTo(x1 - w * 0.16, y0);
    ctx.lineTo(x1, y1);
    ctx.closePath();
    ctx.fillStyle = P.yellow; ctx.fill();
    ctx.clip();

    ctx.fillStyle = P.ink; ctx.globalAlpha = 0.90;
    const sw = w * 0.135;
    for (let i = -2; i < 12; i++) {
      const px = x0 + i * sw * 2;
      ctx.beginPath();
      ctx.moveTo(px, y1 + 4);
      ctx.lineTo(px + sw, y1 + 4);
      ctx.lineTo(px + sw + h * 1.0, y0 - 6);
      ctx.lineTo(px + h * 1.0, y0 - 6);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.40)';
    ctx.fillRect(x0 + w * 0.17, y0, w * 0.66, 2.5);
  }
}

/* ================================================================== *
 *  streaks
 * ================================================================== */
function drawAirStreaks() {
  ctx.fillStyle = P.dash;
  layer(235, 1.30, (x, idx) => {
    ctx.globalAlpha = 0.04 + hash(idx * 3.33) * 0.11;
    const y = groundY - H * 0.36 * hash(idx * 7.71) + H * 0.02;
    const len = 40 + 190 * hash(idx * 5.11);
    rr(x, y, len, Math.max(1.6, R * (0.03 + 0.035 * hash(idx * 2.7))), 3); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawForeground() {
  // near-side hedge, flying past faster than the road (sits below the rig)
  ctx.fillStyle = '#09141C';
  layer(380, 1.55, (x, idx) => {
    const y0 = H * 0.925;
    const w = 300 + 240 * hash(idx * 3.1);
    const h = 30 + 56 * hash(idx * 5.3);
    ctx.beginPath();
    ctx.moveTo(x - 24, H + 12);
    ctx.lineTo(x - 24, y0 + h * 0.52);
    ctx.quadraticCurveTo(x + w * 0.16, y0 - h * 0.38, x + w * 0.36, y0 + h * 0.14);
    ctx.quadraticCurveTo(x + w * 0.54, y0 - h * 0.42, x + w * 0.72, y0 + h * 0.08);
    ctx.quadraticCurveTo(x + w * 0.88, y0 - h * 0.30, x + w + 24, y0 + h * 0.46);
    ctx.lineTo(x + w + 24, H + 12);
    ctx.closePath(); ctx.fill();
  });

  ctx.fillStyle = P.dash;
  layer(330, 1.75, (x, idx) => {
    ctx.globalAlpha = 0.10 + hash(idx * 3.37) * 0.16;
    const y = roadBottom + (H - roadBottom) * (0.08 + 0.80 * hash(idx * 7.77));
    const len = 70 + 260 * hash(idx * 5.13);
    rr(x, y, len, Math.max(2, R * (0.06 + 0.05 * hash(idx * 8.9))), 3); ctx.fill();
  });
  layer(520, 2.15, (x, idx) => {
    ctx.globalAlpha = 0.08 + hash(idx * 4.71) * 0.13;
    const y = H - (H - roadBottom) * (0.12 + 0.62 * hash(idx * 2.13));
    const len = 140 + 320 * hash(idx * 6.31);
    rr(x, y, len, Math.max(2.4, R * 0.10), 4); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ================================================================== *
 *  dust
 * ================================================================== */
function puff(x, y, n, spread, up) {
  for (let i = 0; i < n; i++) {
    const ang = rand(-Math.PI, 0);
    dust.push({
      x: x + rand(-spread, spread),
      y: y + rand(-2, 3),
      vx: Math.cos(ang) * rand(20, 110) - rand(0, 40),
      vy: Math.sin(ang) * rand(20, 90) * (up || 1),
      r: rand(2, 5) * (R / 40) + 1.5,
      life: 0, max: rand(0.32, 0.72)
    });
  }
}

function drawDust() {
  for (const d of dust) {
    const a = 1 - d.life / d.max;
    ctx.globalAlpha = a * a * 0.38;
    ctx.fillStyle = P.cream;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (0.5 + a * 0.9), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================================================================== *
 *  rig parts
 * ================================================================== */
function drawWheel(cx, cy, r, ang) {
  ctx.save();
  ctx.translate(cx, cy);

  // tire
  ctx.fillStyle = P.tire;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();

  // rotating spokes + hub + rim ring
  ctx.save();
  ctx.rotate(ang);
  ctx.strokeStyle = P.rim;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.2, r * 0.11);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.54, 0, TAU); ctx.stroke();
  ctx.lineWidth = Math.max(1.2, r * 0.12);
  for (let i = 0; i < 3; i++) {
    const a = i * TAU / 3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.08, Math.sin(a) * r * 0.08);
    ctx.lineTo(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52);
    ctx.stroke();
  }
  ctx.fillStyle = P.rim;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.15, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawLeg(hip, foot, L1, L2, color, footColor, u, lw) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const d = clamp(len, Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const knee = { x: hip.x + a * ux - h * uy, y: hip.y + a * uy + h * ux };

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = lw * 1.30;
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(knee.x, knee.y); ctx.stroke();
  ctx.lineWidth = lw * 0.95;
  ctx.beginPath(); ctx.moveTo(knee.x, knee.y); ctx.lineTo(foot.x, foot.y); ctx.stroke();

  // bird foot: pad + two toes
  ctx.save();
  ctx.translate(foot.x, foot.y);
  ctx.rotate(0.08);
  ctx.fillStyle = footColor;
  rr(-u * 0.30, -u * 0.18, u * 0.78, u * 0.34, u * 0.16); ctx.fill();
  rr(u * 0.30, -u * 0.10, u * 0.30, u * 0.20, u * 0.09); ctx.fill();
  ctx.restore();
}

function drawBox(u) {
  const w = 2.95 * u, h = 2.45 * u;
  const x = -w / 2, y = -h / 2;

  ctx.fillStyle = P.yellow;
  rr(x, y, w, h, u * 0.22); ctx.fill();

  // lid
  ctx.fillStyle = '#F2BB33';
  rr(x, y, w, h * 0.24, u * 0.20); ctx.fill();
  ctx.fillStyle = P.yellowDk;
  ctx.fillRect(x + u * 0.10, y + h * 0.24, w - u * 0.20, u * 0.09);

  // side highlight
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(x + u * 0.14, y + h * 0.42, u * 0.22, h * 0.44);

  // logo plate + bolt
  ctx.fillStyle = P.ink;
  rr(-u * 0.60, -u * 0.02, u * 1.20, u * 1.20, u * 0.27); ctx.fill();
  ctx.fillStyle = P.white;
  ctx.beginPath();
  ctx.moveTo(u * 0.24, -u * 0.00);
  ctx.lineTo(-u * 0.28, u * 0.62);
  ctx.lineTo(-u * 0.01, u * 0.62);
  ctx.lineTo(-u * 0.19, u * 1.12);
  ctx.lineTo(u * 0.34, u * 0.47);
  ctx.lineTo(u * 0.05, u * 0.47);
  ctx.closePath(); ctx.fill();

  // outline
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = Math.max(1.1, u * 0.07);
  rr(x, y, w, h, u * 0.22); ctx.stroke();
}

/* ================================================================== *
 *  the ostrich + scooter
 * ================================================================== */
function drawShadow() {
  const k = R / 40;
  const air = clamp(1 - jumpY / (R * 3.2), 0.30, 1);
  ctx.save();
  ctx.globalAlpha = 0.46 * air;
  ctx.fillStyle = '#0D1A21';
  ctx.beginPath();
  ctx.ellipse(riderX + 0.10 * R, groundY + 4 * k,
              4.5 * R * (0.74 + 0.26 * air), 0.40 * R * (0.55 + 0.45 * air), 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawRig() {
  const u  = R;
  const k  = u / 40;
  const bob = Math.sin(t * 17) * 1.15 * k;
  const sq  = clamp(sqA, -0.35, 0.40);
  const LW = Math.max(1.1, u * 0.075);

  ctx.save();
  ctx.translate(riderX, groundY - jumpY + bob);
  ctx.rotate(tiltA);
  ctx.scale(1 + sq * 0.45, 1 - sq);
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  const O = P.ink;

  /* ---- geometry ---- */
  const rw  = { x: -2.50 * u, y: -u,        r: u };
  const fw  = { x:  2.60 * u, y: -0.92 * u, r: 0.92 * u };
  const cc  = { x: -0.35 * u, y: -2.05 * u };
  const cr  = 0.50 * u;
  const hip = { x: -1.40 * u, y: -4.70 * u };
  const L1 = 2.05 * u, L2 = 1.90 * u;

  const pNear = { x: cc.x + Math.cos(crankAng) * cr,           y: cc.y + Math.sin(crankAng) * cr };
  const pFar  = { x: cc.x + Math.cos(crankAng + Math.PI) * cr, y: cc.y + Math.sin(crankAng + Math.PI) * cr };

  /* ---- far leg (behind the whole scooter) ---- */
  drawLeg(hip, pFar, L1, L2, P.skinSh, P.skinSh, u, u * 0.30);

  /* ---- wheels ---- */
  drawWheel(rw.x, rw.y, rw.r, wheelAng);
  drawWheel(fw.x, fw.y, fw.r, wheelAng);

  /* ---- fenders ---- */
  ctx.strokeStyle = P.redSh;
  ctx.lineWidth = u * 0.30;
  ctx.beginPath(); ctx.arc(rw.x, rw.y, rw.r * 1.15, -Math.PI * 0.97, -Math.PI * 0.08); ctx.stroke();
  ctx.beginPath(); ctx.arc(fw.x, fw.y, fw.r * 1.17, -Math.PI * 0.97, -Math.PI * 0.08); ctx.stroke();

  /* ---- deck (short, so both wheel tops stay visible) ---- */
  ctx.fillStyle = P.red;
  rr(-1.95 * u, -1.58 * u, 3.90 * u, 0.62 * u, 0.26 * u); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW;
  rr(-1.95 * u, -1.58 * u, 3.90 * u, 0.62 * u, 0.26 * u); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  ctx.fillRect(-1.70 * u, -1.53 * u, 3.40 * u, 0.12 * u);

  /* ---- slanted seat post + saddle ---- */
  ctx.fillStyle = P.red;
  ctx.beginPath();
  ctx.moveTo(-1.78 * u, -1.52 * u);
  ctx.lineTo(-1.34 * u, -1.52 * u);
  ctx.lineTo(-1.92 * u, -4.08 * u);
  ctx.lineTo(-2.36 * u, -4.08 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = P.redSh;
  rr(-2.58 * u, -4.48 * u, 1.80 * u, 0.46 * u, 0.22 * u); ctx.fill(); ctx.stroke();

  /* ---- steering column ---- */
  ctx.fillStyle = P.red;
  ctx.beginPath();
  ctx.moveTo(1.72 * u, -1.58 * u);
  ctx.lineTo(2.30 * u, -1.58 * u);
  ctx.lineTo(2.98 * u, -5.55 * u);
  ctx.lineTo(2.52 * u, -5.55 * u);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* ---- handlebar (bright, so it reads) ---- */
  ctx.fillStyle = P.cream;
  rr(1.98 * u, -5.85 * u, 1.50 * u, 0.36 * u, 0.18 * u); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW * 0.9;
  rr(1.98 * u, -5.85 * u, 1.50 * u, 0.36 * u, 0.18 * u); ctx.stroke();
  ctx.fillStyle = P.ink;
  rr(3.18 * u, -5.90 * u, 0.44 * u, 0.46 * u, 0.20 * u); ctx.fill();

  /* ---- headlight ---- */
  ctx.fillStyle = P.glow; ctx.globalAlpha = 0.50;
  ctx.beginPath(); ctx.arc(3.02 * u, -4.72 * u, 0.70 * u, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(3.02 * u, -4.72 * u, 0.30 * u, 0, TAU); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = LW * 0.8; ctx.stroke();

  /* ---- crank + pedals ---- */
  ctx.strokeStyle = '#4C6270';
  ctx.lineWidth = u * 0.20;
  ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.lineTo(pFar.x, pFar.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cc.x, cc.y); ctx.lineTo(pNear.x, pNear.y); ctx.stroke();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.arc(cc.x, cc.y, u * 0.22, 0, TAU); ctx.fill();

  const pedal = (p, col) => {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = col;
    rr(-u * 0.34, -u * 0.15, u * 0.68, u * 0.30, u * 0.12); ctx.fill();
    ctx.strokeStyle = O; ctx.lineWidth = LW * 0.7;
    rr(-u * 0.34, -u * 0.15, u * 0.68, u * 0.30, u * 0.12); ctx.stroke();
    ctx.restore();
  };
  pedal(pFar, P.redSh);

  /* ---- near leg ---- */
  drawLeg(hip, pNear, L1, L2, P.skin, P.skin, u, u * 0.32);
  pedal(pNear, P.yellow);

  /* ---- tail feathers ---- */
  ctx.fillStyle = P.creamSh;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(-3.35 * u, -6.05 * u + i * 0.50 * u);
    ctx.rotate(-0.26 - i * 0.22);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-1.45 * u, -0.28 * u, -1.85 * u, 0.22 * u);
    ctx.quadraticCurveTo(-1.10 * u, 0.34 * u, 0, 0.28 * u);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---- body ---- */
  const bx = -1.20 * u, by = -6.50 * u, brx = 2.62 * u, bry = 2.50 * u, brot = -0.05;

  ctx.fillStyle = P.cream;
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.fill();

  // vest: clipped to the body, front shoulder raised to the neck
  const vestTop = (m) => {
    ctx.moveTo(bx - brx * 1.1, by - 0.28 * u);
    ctx.quadraticCurveTo(bx - 0.62 * u, by + 0.48 * u, bx + 0.05 * u, by + 0.18 * u);
    ctx.quadraticCurveTo(bx + 0.95 * u, by - 0.16 * u, bx + 1.42 * u, by - 1.02 * u);
    ctx.quadraticCurveTo(bx + 2.02 * u, by + 0.30 * u, bx + brx * 1.1, by + 0.55 * u);
  };
  ctx.save();
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.clip();
  ctx.fillStyle = P.yellow;
  ctx.beginPath();
  vestTop();
  ctx.lineTo(bx + brx * 1.1, by + bry * 1.5);
  ctx.lineTo(bx - brx * 1.1, by + bry * 1.5);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = P.yellowDk;
  ctx.lineWidth = Math.max(1.6, u * 0.11);
  ctx.beginPath(); vestTop(); ctx.stroke();

  // chest badge
  ctx.fillStyle = P.yellowDk;
  rr(bx + 0.62 * u, by + 0.72 * u, 0.66 * u, 0.66 * u, 0.15 * u); ctx.fill();
  ctx.restore();

  // body outline
  ctx.strokeStyle = O;
  ctx.lineWidth = Math.max(1.3, u * 0.09);
  ctx.beginPath(); ctx.ellipse(bx, by, brx, bry, brot, 0, TAU); ctx.stroke();

  // collar, sitting on the vest's raised front shoulder
  ctx.fillStyle = P.yellowSh;
  ctx.beginPath();
  ctx.ellipse(bx + 1.42 * u, by - 1.02 * u, 0.52 * u, 0.30 * u, -0.30, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = Math.max(1.1, u * 0.07); ctx.stroke();

  /* ---- box straps (under the box, over the body) ---- */
  ctx.strokeStyle = P.ink;
  ctx.lineWidth = u * 0.24;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.moveTo(-3.55 * u, -8.15 * u); ctx.lineTo(-2.85 * u, -6.05 * u);
  ctx.moveTo(-2.05 * u, -8.15 * u); ctx.lineTo(-1.75 * u, -6.05 * u);
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* ---- delivery box ---- */
  ctx.save();
  ctx.translate(-2.90 * u, -9.10 * u + boxA);
  ctx.rotate(-0.10 + boxA * 0.0016);
  drawBox(u);
  ctx.restore();

  /* ---- neck + head ---- */
  const neckAngle = 0.135 * Math.sin(t * 3.4) + neckA;
  ctx.save();
  ctx.translate(0.85 * u, -7.60 * u);
  ctx.rotate(neckAngle);
  drawNeckHead(u, LW);
  ctx.restore();

  /* ---- wing gripping the handlebar ---- */
  ctx.strokeStyle = P.yellow;
  ctx.lineWidth = u * 0.60;
  ctx.beginPath();
  ctx.moveTo(1.30 * u, -5.95 * u);
  ctx.quadraticCurveTo(2.05 * u, -6.10 * u, 2.55 * u, -5.68 * u);
  ctx.stroke();
  ctx.fillStyle = P.cream;
  ctx.beginPath(); ctx.arc(2.60 * u, -5.70 * u, u * 0.30, 0, TAU); ctx.fill();
  ctx.strokeStyle = O; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();

  ctx.restore();
}

function drawNeckHead(u, LW) {
  const p0 = { x: 0,        y: 0 };
  const p1 = { x: 0.35 * u, y: -2.20 * u };
  const p2 = { x: 1.90 * u, y: -3.60 * u };
  const p3 = { x: 2.70 * u, y: -3.50 * u };

  const N = 16, pts = [];
  for (let i = 0; i <= N; i++) {
    const s = i / N, m = 1 - s;
    pts.push({
      x: m*m*m*p0.x + 3*m*m*s*p1.x + 3*m*s*s*p2.x + s*s*s*p3.x,
      y: m*m*m*p0.y + 3*m*m*s*p1.y + 3*m*s*s*p2.y + s*s*s*p3.y
    });
  }

  const left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const p = pts[i];
    const q = pts[Math.min(i + 1, N)], r = pts[Math.max(i - 1, 0)];
    let tx = q.x - r.x, ty = q.y - r.y;
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = lerp(1.00 * u, 0.50 * u, i / N) / 2;
    left.push({ x: p.x - ty * w, y: p.y + tx * w });
    right.push({ x: p.x + ty * w, y: p.y - tx * w });
  }
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i <= N; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = N; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.fillStyle = P.cream; ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = LW; ctx.stroke();

  /* head */
  ctx.save();
  ctx.translate(3.50 * u, -3.50 * u);
  ctx.rotate(-0.10);

  // beak
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(0.78 * u, -0.20 * u);
  ctx.lineTo(2.02 * u, 0.10 * u);
  ctx.lineTo(0.78 * u, 0.36 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();

  // skull
  ctx.fillStyle = P.cream;
  ctx.beginPath(); ctx.ellipse(0, 0, 1.10 * u, 0.90 * u, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = LW; ctx.stroke();

  // cap dome
  ctx.fillStyle = P.yellow;
  ctx.beginPath();
  ctx.moveTo(-1.00 * u, -0.42 * u);
  ctx.quadraticCurveTo(-0.12 * u, -1.66 * u, 0.92 * u, -0.60 * u);
  ctx.quadraticCurveTo(-0.05 * u, -0.26 * u, -1.00 * u, -0.42 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.065); ctx.stroke();

  // cap brim
  ctx.fillStyle = P.yellowSh;
  ctx.beginPath();
  ctx.moveTo(0.56 * u, -0.74 * u);
  ctx.quadraticCurveTo(1.58 * u, -0.62 * u, 1.74 * u, -0.12 * u);
  ctx.lineTo(1.42 * u, -0.14 * u);
  ctx.quadraticCurveTo(1.26 * u, -0.50 * u, 0.52 * u, -0.50 * u);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.06); ctx.stroke();

  // eye
  ctx.fillStyle = P.white;
  ctx.beginPath(); ctx.arc(0.20 * u, -0.14 * u, 0.25 * u, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = Math.max(1, u * 0.05); ctx.stroke();
  ctx.fillStyle = P.ink;
  ctx.beginPath(); ctx.arc(0.28 * u, -0.14 * u, 0.135 * u, 0, TAU); ctx.fill();

  ctx.restore();
}

/* ================================================================== *
 *  update
 * ================================================================== */
function land(k) {
  airborne = false;
  jumpY = 0; jumpV = 0;
  sqV   += 2.9;
  boxV  -= 560 * k;
  neckV += 4.2;
  tiltV += 1.7;
  shake  = 2.6 * k;
  puff(riderX - 2.5 * R, groundY, 9, R * 0.9, 1);
  puff(riderX + 2.6 * R, groundY, 7, R * 0.7, 1);
}

function update(dt) {
  const k = R / 40;

  speed = (645 + 55 * Math.sin(t * 0.55)) * k;
  scroll   += speed * dt;
  wheelAng += (speed / R) * dt;
  crankAng += (speed / R) * 0.52 * dt;

  [neckA, neckV] = spring(neckA, neckV, 90, 7.5, dt, 0);
  [boxA,  boxV ] = spring(boxA,  boxV,  120, 10,  dt, 0);
  [sqA,   sqV  ] = spring(sqA,   sqV,   420, 24,  dt, 0);
  const tiltTarget = airborne ? clamp(-jumpV * 0.00020, -0.10, 0.10) : 0;
  [tiltA, tiltV] = spring(tiltA, tiltV, 170, 12, dt, tiltTarget);

  boxTimer -= dt;
  if (boxTimer <= 0) { boxTimer = rand(2.4, 4.4); boxV -= 300 * k; }

  if (airborne) {
    jumpV -= G * k * dt;
    jumpY += jumpV * dt;
    if (jumpY <= 0 && jumpV < 0) land(k);
  }

  if (!bumpInit) { nextBumpAt = scroll + W + 720; bumpInit = true; }
  if (nextBumpAt - scroll < W + 420) {
    bumps.push({ worldX: nextBumpAt, used: false });
    nextBumpAt += rand(1450, 2750);
  }
  const frontWheelX = riderX + 2.6 * R;
  for (const b of bumps) {
    if (b.used) continue;
    const bx = b.worldX - scroll;
    if (bx < frontWheelX - R * 3) { b.used = true; continue; }   // cleared it mid-air
    if (bx < frontWheelX && !airborne) {
      b.used = true;
      airborne = true;
      jumpV = JUMPV * k;
      jumpY = 0.5;
      boxV  -= 300 * k;
      neckV -= 2.6;
    }
  }
  if (bumps.length) bumps = bumps.filter(b => (b.worldX - scroll) > -R * 8);

  if (!airborne) {
    dustTimer -= dt;
    if (dustTimer <= 0) {
      dustTimer = 0.055;
      puff(riderX - 2.5 * R, groundY, 1, R * 0.22, 0.5);
    }
  }

  for (const d of dust) {
    d.life += dt;
    d.x += (d.vx - speed * 0.92) * dt;
    d.y += d.vy * dt;
    d.vy += 210 * dt;
    d.vx *= 0.985;
  }
  if (dust.length) dust = dust.filter(d => d.life < d.max);
  if (dust.length > 260) dust.splice(0, dust.length - 260);

  shake *= Math.pow(0.02, dt);
}

/* ================================================================== *
 *  render
 * ================================================================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const sh = shake > 0.25 ? shake : 0;
  ctx.save();
  if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));

  drawSky();
  drawFar();
  drawMid();
  drawGround();
  drawTrees();
  drawLamps();
  drawRoad();
  drawBumps();
  drawAirStreaks();
  drawDust();
  drawShadow();
  drawRig();
  drawForeground();

  ctx.restore();
}

/* ================================================================== *
 *  loop
 * ================================================================== */
let last = 0, paused = false;

function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (paused) return;
  if (dt > 1 / 30) dt = 1 / 30;
  if (dt < 0) dt = 0;
  t += dt;
  update(dt);
  render();
}

window.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => { last = 0; });

layout();
requestAnimationFrame(frame);

/* ?t=2.6 or #t=2.6 renders a single frozen frame — handy for stills / review */
const mHash = /(?:^|[#&?])t=([\d.]+)/.exec(location.search + location.hash);
if (mHash) {
  setTimeout(() => window.__scene.seek(parseFloat(mHash[1])), 0);
}

/* expose a debug hook so the scene can be probed / frozen for review */
window.__scene = {
  get state() { return { W, H, R, riderX, groundY, roadTop, roadBottom, horizonY, t, airborne, jumpY, wheelAng, crankAng, neckA, boxA, sqA, tiltA, bumps: bumps.length, scroll }; },
  seek(tSec) {
    paused = false;
    scroll = 0; wheelAng = 0; crankAng = 0;
    jumpY = 0; jumpV = 0; airborne = false;
    neckA = neckV = boxA = boxV = sqA = sqV = tiltA = tiltV = 0;
    shake = 0; boxTimer = 2.4;
    bumps = []; nextBumpAt = 0; bumpInit = false;
    dust = []; dustTimer = 0; t = 0;
    const h = 1 / 120;
    let guard = 0;
    while (t < tSec - 1e-9 && guard++ < 100000) {
      const dt = Math.min(h, tSec - t);
      t += dt;
      update(dt);
    }
    render();
    paused = true;
  },
  trace(tSec, step) {
    paused = false;
    scroll = 0; wheelAng = 0; crankAng = 0;
    jumpY = 0; jumpV = 0; airborne = false;
    neckA = neckV = boxA = boxV = sqA = sqV = tiltA = tiltV = 0;
    shake = 0; boxTimer = 2.4;
    bumps = []; nextBumpAt = 0; bumpInit = false;
    dust = []; dustTimer = 0; t = 0;
    const h = step || 1 / 120, ev = [];
    let prevAir = false, guard = 0;
    while (t < tSec - 1e-9 && guard++ < 400000) {
      const dt = Math.min(h, tSec - t);
      t += dt; update(dt);
      if (airborne && !prevAir) ev.push(+t.toFixed(2));
      prevAir = airborne;
    }
    render(); paused = true;
    return ev;
  },
  resume() { paused = false; last = 0; }
};

})();
</script>
</body>
</html>
